<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barimnia – Prototipo</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B1428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barimnia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette e font di Musagete. Layout: un telefono 390x844 al centro, schermate che scorrono, barra in basso fissa. */
  --bg:#1B1428; --surface:#2A1F42; --surface-2:#34285199; --violet:#7C3AED; --violet-dark:#4C1D95;
  --lavender:#C28AE3; --gold:#CDB171; --text:#F5F3FF; --muted:#B8ABD6; --border:#4C3A7A;
  --green:#22C55E; --red:#EF4444; --amber:#F59E0B; --blue:#3B82F6;
  --deg1:#E3B34B; --deg5:#9B6BD0; --deg8:#C28AE3; --d3:#E8955E; --d7:#6FA8DC; --d9:#5FBF9F;
  --font:'Nunito', ui-rounded, 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#120D1C;color:var(--text);font-family:var(--font);font-weight:600;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-weight:700;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lavender);outline-offset:2px}
.phone{width:390px;height:844px;max-height:100%;max-width:100%;background:var(--bg);border-radius:28px;border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:440px),(max-height:720px){.phone{border:0;border-radius:0;width:100%;height:100%}}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
.screen > *{flex-shrink:0}
.btn svg,.round svg{width:20px;height:20px;flex:none}
.screen.center{justify-content:center;text-align:center}
h1{font-size:26px;font-weight:800;margin:0;text-wrap:balance}
h2{font-size:21px;font-weight:800;margin:0;text-wrap:balance}
h3{font-size:16px;font-weight:800;margin:0}
p{margin:0;line-height:1.5;color:var(--text)}
.muted{color:var(--muted);font-size:14px}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{min-height:52px;border-radius:14px;border:0;padding:0 18px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--violet);box-shadow:0 4px 0 var(--violet-dark)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--violet-dark)}
.btn.secondary{background:transparent;border:2px solid var(--border)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.sm{min-height:44px;font-size:14px;width:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--violet);color:var(--text)}
.topbar{display:flex;align-items:center;gap:10px;min-height:48px}
.iconbtn{width:48px;height:48px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:24px;height:24px}
.bar{height:10px;border-radius:999px;background:var(--surface);overflow:hidden;flex:1}
.bar > i{display:block;height:100%;background:var(--green);border-radius:999px}
.segbar{display:flex;gap:4px;flex:1}
.segbar i{flex:1;height:8px;border-radius:999px;background:var(--surface)}
.segbar i.done{background:var(--green)}
.segbar i.cur{background:var(--lavender)}
.polly{display:flex;align-items:flex-end;gap:10px}
.polly img{width:96px;height:auto;flex:none}
.polly.big{flex-direction:column;align-items:center}
.polly.big img{width:230px}
.bubble{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:14px;line-height:1.4}
.polly.big .bubble{border-radius:16px}
.remember{border-left:4px solid var(--gold);background:#CDB1711A;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.remember b{color:var(--gold);display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.nav{display:flex;border-top:1px solid var(--border);background:var(--bg);padding:6px 6px 10px}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);min-height:52px;justify-content:center;border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--lavender)}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:12px 8px;min-height:56px;text-align:center;font-size:15px}
.opt.on{border-color:var(--lavender);background:#C28AE322}
.opt .muted{font-size:11.5px;margin-top:4px;display:block}
.opt.ok{border-color:var(--green);background:#22C55E22}
.opt.ko{border-color:var(--red);background:#EF444422}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:var(--border);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:left .15s}
.switch.on{background:var(--violet)}
.switch.on::after{left:25px}
/* Percorso */
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:6px 0 10px;position:relative}
.path > *:not(.trail){position:relative;z-index:1}
.trail{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.node.tappa{background:none;box-shadow:none;overflow:visible}
.tappa{position:relative}
.tappa img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.node.tappa.t-cur img{width:124px}.node.tappa.t-done img,.node.tappa.t-lock img{width:78px}.node.tappa.t-ring img{width:88px}
.tappa .lbl{position:relative;z-index:1;color:#fff;font-weight:800;font-size:18px}
.mnode .mid.tappa{background:none;box-shadow:none;width:40px;height:40px}
.mnode .mid.tappa.t-cur img{width:66px}.mnode .mid.tappa.t-done img,.mnode .mid.tappa.t-lock img{width:41px}.mnode .mid.tappa.t-ring img{width:47px}
.mnode .mid .lbl{font-size:12px}
.stop .t .num,.mnode .mt .num{color:var(--lavender);font-weight:800;margin-right:2px}
.stop{position:relative}
.pathpolly{position:absolute;top:-8px;width:112px;height:auto;pointer-events:none;animation:pollyfloat 3s ease-in-out infinite}
.pathpolly.l{left:-74px}.pathpolly.r{left:136px}
@keyframes pollyfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){.pathpolly{animation:none}}
.rotate{display:none}
@media (orientation: landscape) and (max-height: 520px) and (pointer: coarse){
  .rotate{display:flex;position:fixed;inset:0;z-index:999;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
  .rotate img{width:120px;height:auto}
}
.stop{display:flex;flex-direction:column;align-items:center;gap:6px;width:180px;text-align:center}
.node{width:76px;height:76px;border-radius:50%;border:0;background:var(--violet);box-shadow:0 5px 0 var(--violet-dark);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;position:relative}
.node.done{background:var(--gold);box-shadow:0 5px 0 #8f7a45;color:#1B1428}
.node.empty{background:var(--surface);box-shadow:0 5px 0 #20172f;color:var(--muted)}
.node .lock{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.node .lock svg{width:14px;height:14px}
.stop .t{font-size:14px;line-height:1.25}
.stop .req{font-size:11.5px;color:var(--muted)}
.module{width:100%;max-width:340px;background:var(--surface);border:1px dashed var(--border);border-radius:16px;padding:10px 10px 12px}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px}.mhead svg{width:18px;height:18px;flex:none;color:var(--lavender)}.mhead .muted{margin-left:auto}
.mrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.mnode{flex:none;width:96px;min-height:96px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 6px;text-align:center;font-family:inherit}
.mnode .mid{width:36px;height:36px;border-radius:50%;background:var(--violet);box-shadow:0 3px 0 var(--violet-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.mnode.done .mid{background:var(--green);box-shadow:0 3px 0 #15803d}.mnode .mid svg{width:18px;height:18px}
.mnode .mt{font-size:11.5px;font-weight:700;line-height:1.2}.mnode .ml{font-size:10.5px;color:var(--muted)}
.branch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:8px 12px;max-width:300px;line-height:1.35}
.branch svg{width:18px;height:18px;flex:none}
/* Capitolo */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;min-height:64px;text-align:left;width:100%}
.step .ic{width:40px;height:40px;border-radius:12px;background:#7C3AED33;display:flex;align-items:center;justify-content:center;flex:none}
.step .ic svg{width:22px;height:22px}
.step .st{font-size:12px;color:var(--muted);text-align:right;flex:none}
.step .st.ok{color:var(--green)}
.step.final{border:2px solid var(--gold)}
/* Notazione */
.notation{background:#140F1F;border:1px solid var(--border);border-radius:14px;padding:10px 6px;overflow-x:auto}
.notation svg{display:block}
.n-dot circle{transition:r .08s}
.n-dot.on circle{stroke:var(--text);stroke-width:3}
.n-ev.on rect{fill:var(--lavender)}
.n-ev.on text{fill:#1B1428}
.n-note.on ellipse{fill:var(--lavender);stroke:var(--lavender)}
.chords{display:flex;gap:6px;flex-wrap:wrap}
.chords span{border:1px solid var(--border);border-radius:8px;padding:2px 10px;font-size:14px}
.chords span.on{background:var(--violet);border-color:var(--violet)}
/* Metronomo */
.metro{display:flex;flex-direction:column;gap:12px;align-items:center}
.bpm{display:flex;align-items:center;gap:14px}
.bpm b{font-size:44px;font-weight:800;min-width:96px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.bpm small{display:block;font-size:12px;color:var(--muted);text-align:center}
.round{width:52px;height:52px;border-radius:50%;border:2px solid var(--border);background:transparent;font-size:16px}
.beats{display:flex;gap:10px}
.beats i{width:12px;height:12px;border-radius:50%;background:var(--border)}
.beats i:first-child{width:16px;height:16px;margin-top:-2px}
.beats i.on{background:var(--lavender)}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opts button{border:1px solid var(--border);background:transparent;border-radius:999px;padding:0 12px;min-height:36px;font-size:13px;color:var(--muted)}
.opts button.on{border-color:var(--lavender);color:var(--text);background:#C28AE322}
.go{width:100%}
/* Foglio dal basso */
.veil{position:absolute;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:18px 16px 22px;width:100%;display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.switch::after{transition:none}}
.evals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.evals button{border-radius:14px;border:2px solid var(--border);background:transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px}
.evals button svg{width:20px;height:20px}
.evals .g.on{border-color:var(--green);background:#22C55E26}
.evals .a.on{border-color:var(--amber);background:#F59E0B26}
.evals .r.on{border-color:var(--red);background:#EF444426}
.banner{border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;font-size:14px}
.banner.good{background:#22C55E22;border:1px solid var(--green)}
.banner.bad{background:#EF444422;border:1px solid var(--red)}
.banner.info{background:#3B82F622;border:1px solid var(--blue)}
.banner svg{width:22px;height:22px;flex:none}
.recipe dt{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.recipe dd{margin:2px 0 0;line-height:1.45;font-size:14.5px}
.recipe ol{margin:2px 0 0;padding-left:20px;line-height:1.45;font-size:14.5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14.5px;line-height:1.4;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--violet);flex:none;margin:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
.tile b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--surface);border:1px solid var(--lavender);border-radius:14px;padding:12px 14px;font-size:14px;z-index:6}
.sticky{position:sticky;bottom:-24px;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 0;margin-top:auto}
.wordmark{font-size:40px;font-weight:800;letter-spacing:.01em;background:linear-gradient(90deg,var(--gold),var(--lavender));-webkit-background-clip:text;background-clip:text;color:transparent}
.proto{font-size:11.5px;color:var(--muted);text-align:center}
.me{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 2px}
.avatar{position:relative;overflow:visible;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#6B55A8,#2A1F42 75%);border:3px solid var(--violet);box-shadow:0 0 0 4px rgba(124,58,237,.18);display:grid;place-items:center;cursor:pointer}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar img.ph{object-fit:cover}
.avatar .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;border:3px solid var(--bg)}
.avatar .cam svg{width:15px;height:15px}
.myname{background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--text);font-family:inherit;font-size:20px;font-weight:800;line-height:1.2;text-align:center;width:220px;padding:2px 4px}
.myname:focus{outline:none;border-bottom-color:var(--lavender)}
.myname::placeholder{color:var(--muted)}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 8px 14px;border-bottom:1px solid var(--border);background:var(--bg);flex:none}
.brand{display:flex;align-items:center;gap:8px}
.brand img.logo{height:44px;width:auto;display:block}
.logo-big{width:min(290px,80%);height:auto;display:block;margin:0 auto}
.navic{width:28px;height:26px;object-fit:contain;display:block}
.wordmark.sm{font-size:22px}
.instr{display:flex;align-items:center;gap:6px;min-height:40px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 12px;font-size:13px}
.instr svg{width:18px;height:18px}
.instr.mini{min-height:36px;padding:0 10px;font-size:12px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="app" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</div>

S1:{steps:[
  {type:"lezione", title:"Il pollice", min:3, polly:["slap","Pollice duro, polso morbido: si rimbalza, non si spinge!"],
   text:["Nello slap il pollice colpisce la corda e rimbalza via subito, come una bacchetta su un tamburo. Il punto giusto è di solito dove finisce il manico.","Il movimento nasce dalla rotazione del polso (come girare una maniglia), non dal braccio. Ognuno trova la sua angolazione: conta che il suono sia secco e chiaro."],
   remember:"Colpisci e rimbalza. T = pollice."},
  {type:"lezione", title:"Smorzare nello slap", min:3, polly:["pensierosa","Nello slap il silenzio è metà del groove."],
   text:["Lo slap fa vibrare forte tutte le corde: la sinistra appoggia le dita libere sulle corde che non suonano, e allenta subito le note per accorciarle.","Il palmo destro può appoggiarsi sulle corde gravi mentre il pollice colpisce quelle più acute."],
   remember:"Sinistra smorza, destra percuote: insieme fanno il groove."},
  {type:"app", title:"Pollice", min:2, questions:[
    {q:"Dove colpisce di solito il pollice?", o:["Verso la fine del manico","Sul ponte","Sulla paletta"], c:0},
    {q:"Il movimento dello slap nasce…", o:["Dalla rotazione del polso","Dalla spalla","Dalle dita"], c:0},
    {q:"Dopo il colpo il pollice…", o:["Rimbalza via","Resta sulla corda","Spinge verso il basso"], c:0}]},
  {type:"strumento", title:"E1 · Corde vuote", min:4, bpm:[60,90], view:"tab",
   task:"Solo pollice sulle corde vuote. Ogni colpo secco, uguale, con la corda che suona piena.",

S2:{steps:[
  {type:"lezione", title:"Il pop", min:3, polly:["slap","Aggancia, tira, lascia: il pop è un piccolo elastico."],
   text:["Il pop si fa agganciando la corda con l'indice (o il medio) e tirandola leggermente verso l'esterno: lasciandola, sbatte sui tasti con un suono brillante.","Non serve tirare forte: basta poco per un suono chiaro. Si usa soprattutto sulle corde Re e Sol."],
   remember:"P = pop. Aggancia poco, tira poco, lascia."},
  {type:"lezione", title:"Pollice e pop", min:3, polly:["salto","Tum-pa, tum-pa: il dialogo più famoso del basso."],
   text:["La combinazione classica: pollice sulla nota grave, pop sull'ottava. La mano ruota: il pollice scende, l'indice sale.","Le ghost notes della sinistra (note morte suonate con un colpo della mano sulle corde) riempiono gli spazi tra pollice e pop."],
   remember:"Pollice in basso, pop in alto: la mano ruota come una maniglia."},
  {type:"app", title:"Pop", min:2, questions:[
    {q:"In tab, P sotto una nota indica…", o:["Pop","Pull-off","Plettro"], c:0},
    {q:"Su quali corde si fa più spesso il pop?", o:["Re e Sol","Mi e La","Solo Mi"], c:0},
    {q:"Nelle ottave slap il pollice suona…", o:["La nota grave","L'ottava","Nessuna"], c:0}]},
  {type:"strumento", title:"E1 · Solo pop", min:4, bpm:[60,90], view:"tab",

   text:["Hammer-on e pull-off rendono lo slap scorrevole: il pollice colpisce, la sinistra aggiunge una nota senza un nuovo colpo.","La sinistra può anche “battere” sulle corde (hammer di sinistra senza nota, una ghost percussiva): è il segreto dei groove pieni ma leggeri."],

  {type:"lezione", title:"Sedicesimi e thumping", min:3, polly:["carica","Sedicesimi slap: la mano non si ferma mai."],
   text:["Per i sedicesimi in slap la destra si muove in modo continuo: pollice, ghost, pop, ghost. Le note che non vuoi sentire si smorzano con la sinistra.","“Thumping” è il pollice che suona linee intere, anche veloci, con la sinistra che lavora molto di legati e smorzamenti."],
   remember:"Mano destra continua, sinistra che decide cosa suona."},

   text:["Il numero in alto dice quanti battiti ci sono in una battuta, quello in basso quale figura vale un battito: 4/4 sono quattro semiminime, 3/4 tre semiminime, 6/8 sei ottavi.","Il 6/8 si sente in due, a gruppi di tre ottavi: “UN-due-tre DUE-due-tre”."],
   remember:"4/4 = quattro quarti · 3/4 = tre quarti, il valzer · 6/8 = due gruppi da tre ottavi."},

  {type:"lezione", title:"Tab e pentagramma", min:3, polly:["felice","La tab dice dove, il pentagramma dice cosa e quando. Insieme sono imbattibili."],

A3:{steps:[
  {type:"lezione", title:"Cos'è un intervallo", min:3, polly:["pensierosa","La distanza tra due note. Misurata in tasti, ricordata in forme."],
   text:["Un intervallo è la distanza tra due note. Sul basso si misura in tasti: ogni tasto è un semitono.","Ogni intervallo ha un nome (seconda, terza, quarta…) e una qualità (maggiore, minore, giusta, aumentata, diminuita). E soprattutto ha una forma fissa sul manico: la stessa ovunque."],
   remember:"Un tasto = un semitono. Stessa distanza = stessa forma, ovunque."},
  {type:"lezione", title:"Le forme vicine", min:5, polly:["maestra","Imparale come facce di amici: le riconosci al volo."],
   text:["Partendo dal Do (corda La, 3° tasto), sulla stessa corda: seconda minore 1 tasto sopra, seconda maggiore 2 tasti, terza minore 3 tasti, terza maggiore 4 tasti.","Le terze hanno due forme, ed è bene conoscerle tutte e due. Terza minore: stessa corda, 3 tasti sopra, oppure corda successiva, 2 tasti indietro. Terza maggiore: stessa corda, 4 tasti sopra, oppure corda successiva, 1 tasto indietro. Poi la quarta giusta: corda successiva, stesso tasto. La quinta giusta: corda successiva, 2 tasti avanti."],
   remember:"3ª m: stessa corda +3 oppure corda sopra −2 · 3ª M: stessa corda +4 oppure corda sopra −1 · 4ª: corda sopra, stesso tasto · 5ª: corda sopra +2.", board:"A3:1 A6:b3 A7:3 D1:b3 D2:3 D3:4 D5:5"},
  {type:"lezione", title:"Le forme larghe", min:4, polly:["salto","Sesta, settima, ottava: salti grandi, forme semplici."],
   text:["Tritono (quarta aumentata): corda successiva, un tasto avanti. Anche le seste hanno due forme, come le terze. Sesta minore: due corde sopra, due tasti indietro, oppure corda successiva, tre tasti avanti. Sesta maggiore: due corde sopra, un tasto indietro, oppure corda successiva, quattro tasti avanti.","Settima minore: due corde sopra, stesso tasto. Settima maggiore: due corde sopra, un tasto avanti. Ottava: due corde sopra, due tasti avanti."],
   remember:"6ª m: due corde sopra −2 oppure corda sopra +3 · 6ª M: due corde sopra −1 oppure corda sopra +4 · ♭7: due corde sopra, stesso tasto · 7: +1 · 8: +2.", board:"A3:1 D4:#4 D6:b6 D7:6 G1:b6 G2:6 G3:b7 G4:7 G5:8"},

A4:{steps:[
  {type:"lezione", title:"La ricetta della scala maggiore", min:4, polly:["maestra","Tono, tono, semitono… e il resto viene da sé."],
   text:["La scala maggiore è una sequenza di sette note con una ricetta fissa di distanze: tono, tono, semitono, tono, tono, tono, semitono (2-2-1-2-2-2-1 tasti).","Partendo da qualsiasi nota e seguendo la ricetta ottieni la scala maggiore di quella nota. Do maggiore è l'unica senza alterazioni."],
   remember:"T T S T T T S = 2-2-1-2-2-2-1 tasti.", board:"A3:1 A5:2 A7:3 A8:4 A10:5 A12:6 A14:7 A15:8"},
  {type:"lezione", title:"Tre diteggiature", min:5, polly:["pensierosa","Tre forme, una scala. Scegli quella che ti sta comoda lì dove sei."],
   text:["Forma 1, dal medio: la fondamentale sotto il dito 2 sulla corda Mi (o La), quattro tasti senza spostamenti. Esempio: Sol dal 3° tasto della corda Mi.","Forma 2, dall'indice: la fondamentale sotto l'indice, con un piccolo allungamento del mignolo. Forma 3, tre note per corda: comoda per salire lungo il manico (l'hai vista in T10). Verifica tu quale suona più pulita sotto le tue mani: non esiste una sola strada."],
   remember:"Forma 1 = dito 2 · Forma 2 = dito 1 · Forma 3 = tre note per corda."},
  {type:"app", title:"Costruisci la scala", min:3, questions:[

  {type:"lezione", title:"Armature e giro delle quinte", min:5, polly:["maestra","Il giro delle quinte: la mappa del tesoro delle tonalità."],
   text:["Le alterazioni di una tonalità si scrivono una volta sola all'inizio del rigo: è l'armatura di chiave. Do: nessuna. Sol: Fa♯. Re: Fa♯ Do♯. Fa: Si♭. Si♭: Si♭ Mi♭.","Il giro delle quinte mette in fila le tonalità: salendo di quinta (Do-Sol-Re-La-Mi-Si) si aggiunge un diesis; scendendo di quinta (Do-Fa-Si♭-Mi♭-La♭) si aggiunge un bemolle. Sul basso è un movimento naturale: la quinta è la corda sopra, due tasti avanti; la quarta è la corda sopra, stesso tasto."],
   remember:"Diesis: Fa Do Sol Re La Mi Si · Bemolli: Si Mi La Re Sol Do Fa."},

   task:"Le fondamentali del giro delle quarte (il giro delle quinte al contrario): ogni nota è sulla corda sopra, stesso tasto, finché c'è spazio. È il movimento più comune dei bassi.",
   bars:"A3q D3q G3q D1q | G1q D4q G4q A2q | D2q G2q D0q G0q | A3w"},

A5:{steps:[
  {type:"lezione", title:"La triade", min:4, polly:["basso","Tre note, una famiglia: fondamentale, terza e quinta."],
   text:["Una triade è un accordo di tre note sovrapposte per terze: fondamentale, terza e quinta. La terza decide il carattere: maggiore (4 semitoni) suona aperta, minore (3 semitoni) suona più scura.","Ci sono anche la triade diminuita (terza minore e quinta diminuita) e quella aumentata (terza maggiore e quinta aumentata)."],
   remember:"Maggiore 1-3-5 · minore 1-♭3-5 · diminuita 1-♭3-♭5 · aumentata 1-3-♯5."},
  {type:"lezione", title:"Le forme delle triadi", min:4, polly:["maestra","Una forma per accordo: le dita le ricordano da sole."],
   text:["Dal Do (corda La, 3° tasto): maggiore Do-Mi-Sol (La 3 · Re 2 · Re 5), minore Do-Mi♭-Sol (La 3 · Re 1 · Re 5).","Diminuita Do-Mi♭-Sol♭ (La 3 · Re 1 · Re 4), aumentata Do-Mi-Sol♯ (La 3 · Re 2 · Re 6). Aggiungendo l'ottava (Sol 5) hai l'arpeggio completo."],
   remember:"Cambia solo un dito e cambia tutto l'accordo.", board:"A3:1 D2:3 D5:5 G5:8"},

  {type:"lezione", title:"Rivolti", min:4, polly:["pensierosa","Stesse note, ordine diverso: l'accordo cambia vestito."],
   text:["Una triade si dice in stato fondamentale quando la nota più grave è la fondamentale. Nel primo rivolto la nota più grave è la terza (Do/Mi), nel secondo la quinta (Do/Sol).","Il basso decide il rivolto: quando nella sigla vedi una barra (C/E), la nota dopo la barra è quella che devi suonare tu."],
   remember:"C/E = accordo di Do con il Mi al basso."},

A6:{steps:[
  {type:"lezione", title:"La minore naturale", min:4, polly:["pensierosa","Stesse note di Do maggiore, ma partendo dal La. E tutto si fa malinconico."],
   text:["La scala minore naturale ha la ricetta T S T T S T T. Ogni scala maggiore ha una “relativa minore” con le stesse note: parte dal sesto grado. La minore è la relativa di Do maggiore. Rispetto alla maggiore con la stessa fondamentale (La maggiore) ha la terza, la sesta e la settima abbassate.","Due diteggiature. Posizione stretta: fondamentale, 2 e ♭3 sulla stessa corda; 4, 5 e ♭6 sulla corda sotto; ♭7 e 8 su quella ancora sotto. Posizione larga: fondamentale e 2 sulla stessa corda; ♭3, 4 e 5 sulla corda sotto; ♭6, ♭7 e 8 su quella ancora sotto."],
   remember:"Minore naturale = 1 2 ♭3 4 5 ♭6 ♭7.", board:"E5:1 E7:2 E8:b3 A5:4 A7:5 A8:b6 D5:b7 D7:8"},
  {type:"lezione", title:"Le pentatoniche", min:4, polly:["salto","Cinque note, zero errori: la scala più amata del rock."],
   text:["La pentatonica minore usa cinque note: 1 ♭3 4 5 ♭7. La maggiore: 1 2 3 5 6. Non hanno semitoni, quindi suonano bene quasi su tutto.","La pentatonica di La minore e quella di Do maggiore hanno le stesse note (La Do Re Mi Sol): cambia solo la nota di partenza."],
   remember:"Penta minore 1 ♭3 4 5 ♭7 · Penta maggiore 1 2 3 5 6.", board:"E5:1 E8:b3 A5:4 A7:5 D5:b7 D7:8"},

A11:{steps:[
  {type:"lezione", title:"Una scala, sette modi", min:5, polly:["maestra","Stesse note, punto di partenza diverso: sette colori da una sola tavolozza."],
   text:["Partendo da ogni nota della scala maggiore si ottiene un modo: ionico (I), dorico (II), frigio (III), lidio (IV), misolidio (V), eolio (VI), locrio (VII). In Do: Do ionico, Re dorico, Mi frigio, Fa lidio, Sol misolidio, La eolio, Si locrio.","Ogni modo ha una nota caratteristica: dorico la 6 maggiore, frigio la ♭2, lidio la ♯4, misolidio la ♭7, locrio la ♭5."],
   remember:"Dorico 6 · frigio ♭2 · lidio ♯4 · misolidio ♭7 · locrio ♭5."},
  {type:"lezione", title:"Quale modo su quale accordo", min:4, polly:["pensierosa","L'accordo ti dice il modo, come la sigla ti dice la fondamentale."],
   text:["Ogni accordo della scala armonizzata ha il suo modo: maj7 → ionico o lidio, m7 → dorico (o eolio, o frigio), 7 → misolidio, m7♭5 → locrio.","Il dorico è il modo minore più usato in funk, jazz e fusion: la sesta maggiore lo rende meno triste dell'eolio."],
   remember:"maj7 ionico/lidio · m7 dorico · 7 misolidio · ø locrio."},
  {type:"lezione", title:"Dalla minore armonica", min:4, polly:["cuffie","Un tocco di Spagna, uno di Medio Oriente: il frigio dominante."],
   text:["La minore armonica è la minore naturale con la settima alzata (in La: La Si Do Re Mi Fa Sol♯). Crea un V7 vero (E7 in La minore).","Il suo modo più usato è il quinto, il frigio dominante (in Mi: Mi Fa Sol♯ La Si Do Re): ♭2 e terza maggiore insieme. È il suono del flamenco, del metal e della musica mediorientale, sul V7 di una tonalità minore."],
   remember:"Minore armonica = minore naturale con la 7 alzata · Frigio dominante = 1 ♭2 3 4 5 ♭6 ♭7."},
  {type:"app", title:"Modi", min:4, questions:[
    {q:"Qual è il modo che parte dal V grado?", o:["Misolidio","Lidio","Dorico"], c:0},
    {q:"Su un accordo m7 “funky”, il modo più usato è…", o:["Dorico","Locrio","Lidio"], c:0},
    {q:"La nota caratteristica del lidio è…", o:["♯4","♭7","♭2"], c:0},
    {q:"Il frigio dominante si usa soprattutto su…", o:["Il V7 di una tonalità minore","Un maj7","Un m7♭5"], c:0}]},

A12:{steps:[
  {type:"lezione", title:"Note che portano da qualche parte", min:4, polly:["salto","Ogni nota è un passo: quella giusta ti porta all'accordo dopo."],
   text:["Le note di passaggio collegano due note dell'accordo: diatoniche (della scala) o cromatiche (a un semitono). Le note di volta si allontanano di un passo e tornano.","L'approccio cromatico è il trucco più potente del walking: sull'ultimo battito suoni la nota a un semitono sopra o sotto la fondamentale dell'accordo successivo."],
   remember:"Ultimo battito: un semitono sopra o sotto la prossima fondamentale."},
  {type:"lezione", title:"Chiudere sulla nota giusta", min:3, polly:["maestra","Le note di passaggio passano. Le note dell'accordo restano."],
   text:["Le note “estranee” funzionano se vanno a cadere su una nota dell'accordo, di solito sul battito forte. È il principio della tensione e risoluzione.","Regola d'oro: sul primo tempo una nota dell'accordo (meglio la fondamentale), sul quarto la nota che prepara la battuta dopo."],
   remember:"Tempo 1 = nota dell'accordo · tempo 4 = nota di approccio."},

A13:{steps:[
  {type:"lezione", title:"Dominanti secondarie", min:5, polly:["pensierosa","Ogni accordo può avere il suo V7 personale. Anche quelli minori."],
   text:["Una dominante secondaria è un accordo di settima di dominante che “prepara” un accordo diverso dalla tonica: è il V7 di quell'accordo. In Do, A7 è il V7 di Dm (si scrive V7/II), D7 è il V7 di G (V7/V), E7 è il V7 di Am (V7/VI).","Per il basso la notizia è la terza: A7 ha il Do♯, D7 ha il Fa♯, E7 ha il Sol♯. Sono note “fuori tonalità” che spingono verso l'accordo successivo."],
   remember:"V7/II in Do = A7 (Do♯) · V7/V = D7 (Fa♯) · V7/VI = E7 (Sol♯)."},
  {type:"lezione", title:"Sostituto di tritono", min:4, polly:["salto","Il basso scende di un semitono invece di saltare: elegantissimo."],
   text:["Il sostituto di tritono sostituisce un V7 con il 7 che sta a un tritono di distanza: al posto di G7 si suona D♭7. Hanno la stessa coppia terza-settima (Si e Fa), quindi funzionano allo stesso modo.","Per il basso significa una linea cromatica che scende: Dm7 - D♭7 - Cmaj7."],
   remember:"G7 → D♭7: stessa terza e settima, basso cromatico."},
  {type:"lezione", title:"Interscambio modale", min:4, polly:["cuffie","Un accordo preso in prestito dal minore: un'ombra improvvisa nella luce."],
   text:["L'interscambio modale prende in prestito accordi dalla tonalità minore omonima: in Do maggiore si usano Fm, B♭7, A♭maj7, E♭maj7.","Il più famoso è il IV minore (F → Fm → C): il La♭ scende al Sol e crea un'emozione tipica delle ballad."],
   remember:"In Do: Fm, B♭7, A♭, E♭ vengono da Do minore."},

    {q:"Fm in Do maggiore è…", o:["Un prestito dal minore","Un errore","La relativa minore"], c:0}]},

A14:{steps:[
  {type:"lezione", title:"La minore melodica", min:4, polly:["maestra","La minore melodica del jazz: minore sotto, maggiore sopra."],
   text:["Nel jazz la minore melodica è la scala maggiore con la terza abbassata: 1 2 ♭3 4 5 6 7 (in Do: Do Re Mi♭ Fa Sol La Si). Sale e scende uguale.","Si usa su accordi m6 e m(maj7), e dai suoi modi nascono due scale fondamentali per le dominanti."],
   remember:"Minore melodica = maggiore con la ♭3."},
  {type:"lezione", title:"Lidia dominante e alterata", min:5, polly:["pensierosa","Dalla stessa scala: una dominante luminosa e una piena di tensione."],
   text:["Il quarto modo della minore melodica è il lidio dominante (1 2 3 ♯4 5 6 ♭7): su un 7 che non risolve, per esempio F7 in un blues, ha un suono aperto e moderno.","Il settimo modo è l'alterata (1 ♭9 ♯9 3 ♭5 ♯5 ♭7): su un V7 che risolve, piena di tensione. G alterata = La♭ minore melodica partendo da Sol."],
   remember:"Lidio dominante = 4° modo · Alterata = 7° modo della minore melodica."},
  {type:"lezione", title:"Scale simmetriche", min:4, polly:["salto","Scale che si ripetono uguali: geometria pura sul manico."],
   text:["La scala diminuita alterna semitono e tono (S-T, su un 7♭9) o tono e semitono (T-S, su un dim7). Si ripete ogni terza minore: tre tasti sopra trovi la stessa forma.","La scala esatonale è fatta solo di toni (Do Re Mi Fa♯ Sol♯ La♯): si usa sugli accordi 7♯5 e dà un suono sognante, sospeso."],
   remember:"Diminuita S-T su 7♭9 · T-S su dim7 · Esatonale = solo toni, su 7♯5."},
  {type:"app", title:"Scale avanzate", min:4, questions:[
    {q:"La minore melodica di Do contiene…", o:["Mi♭ e Si","Mi♭ e Si♭","Mi e Si♭"], c:0},
    {q:"L'alterata è il modo numero…", o:["7","4","2"], c:0},
    {q:"Ogni quanti tasti si ripete la scala diminuita?", o:["3","2","4"], c:0},
    {q:"La scala esatonale è fatta di…", o:["Soli toni","Soli semitoni","Toni e semitoni alternati"], c:0}]},

   remember:"Casa: La e Mi · blues: Do e Mi♭ · cambio: Fa♯ su D7, Sol♯ su E7."},

L6:{steps:[
  {type:"lezione", title:"Il funk con le dita", min:4, polly:["salto","Uno forte, il resto leggero: il funk è dinamica."],
   text:["Il funk con le dita vive di sedicesimi, ghost notes e accenti. La fondamentale sull'“uno” è sacra; il resto è un dialogo di note piene, note morte e pause.","Il volume conta: le note piene suonano decise, le ghost appena accennate. Più contrasto c'è, più il groove “spinge”."],
   remember:"L'uno è sacro · contrasto tra note piene e ghost."},
  {type:"lezione", title:"R&B e soul", min:4, polly:["cuffie","Groove morbido e profondo: suona dietro il battito, non davanti."],
   text:["Nell'R&B e nel soul il basso è più melodico e rilassato: usa le note degli accordi di settima (♭3, ♭7, 9) e spesso suona leggermente “dietro” il battito, con un tocco pieno e caldo.","Sui giri m7-7 (come Dm7-G7) la terza e la settima di ogni accordo creano piccole melodie molto efficaci."],
   remember:"R&B = note degli accordi, tocco caldo, leggermente dietro il battito."},

   remember:"Grave, rotondo, con spazio."},
  {type:"lezione", title:"One drop e steppers", min:4, polly:["conta","One drop: la cassa salta l'uno. Steppers: la cassa non salta niente."],
   text:["Nel “one drop” la batteria lascia vuoto il primo battito e mette cassa e rullante insieme sul 3. Il basso spesso lascia vuoto anche l'uno e parte subito dopo.","Nello “steppers” la cassa batte su tutti e quattro i tempi: il basso spinge di più, spesso con note ripetute."],
   remember:"One drop = cassa sul 3, uno vuoto · Steppers = cassa su tutti i tempi."},

   text:["L'approccio più usato sul quarto tempo è cromatico: un semitono sotto o sopra la fondamentale successiva. Funziona su quasi tutto.","Alternativa: la quinta della fondamentale successiva (“approccio di dominante”), che suona più tradizionale."],
   remember:"Tempo 4: semitono sopra/sotto, oppure la quinta del prossimo accordo."},

   text:["Le note guida sono la terza e la settima di ogni accordo: dicono se è maggiore o minore e che tipo di settima ha. Da un accordo al successivo si muovono di pochissimo, spesso di un semitono.","In un II-V-I: la ♭7 di Dm7 (Do) scende alla 3 di G7 (Si); la ♭7 di G7 (Fa) scende alla 3 di Cmaj7 (Mi)."],

   remember:"Parti dalla 3 o dalla 7 · cambia direzione · risolvi."},

   text:["I tempi dispari si capiscono a gruppi di 2 e di 3. Un 7/8 può essere 2+2+3 (“UN-due UN-due UN-due-tre”), un 5/4 può essere 3+2, un 9/8 balcanico 2+2+2+3.","Il segreto: contare i gruppi, non le singole note. Gli accenti cadono sull'inizio di ogni gruppo."],

  {type:"lezione", title:"Cambi di tempo", min:3, polly:["pensierosa","Una battuta da quattro, una da tre: il pavimento si muove, tu no."],
   text:["Alcuni brani alternano battute di lunghezza diversa, per esempio 4/4 e 3/4. Il battito resta uguale: cambia solo quanti battiti ci sono prima del nuovo “uno”.","Leggi il tempo all'inizio di ogni battuta e conta sempre ad alta voce, finché non diventa naturale."],
   remember:"Il battito non cambia: cambia dove cade l'uno."},

   text:["Il metal usa terzine (ritmi in 12/8 o shuffle pesante) e sedicesimi continui, spesso col galoppo. Sono questioni di resistenza: si allenano col metodo dei BPM, partendo lenti.","Con le dita, alterna sempre; col plettro, alternata stretta."],

L18:{steps:[
  {type:"lezione", title:"Il 12/8 africano", min:4, polly:["cuffie","Quattro battiti, ognuno diviso in tre: il cuore di tanta musica africana."],
   text:["Molta musica dell'Africa occidentale e la musica afro-cubana si sentono in 12/8: quattro battiti, ognuno diviso in tre ottavi. Il basso si incastra con le percussioni con figure brevi e ripetute.","Conta “UN-due-tre DUE-due-tre…” e senti come le note cadono tra i battiti."],
   remember:"12/8 = 4 battiti × 3 ottavi."},
  {type:"lezione", title:"Flamenco e Balcani", min:4, polly:["pensierosa","La cadenza andalusa e il 9/8: due viaggi in poche battute."],
   text:["La cadenza andalusa (Am-G-F-E) è il cuore del suono flamenco: sull'ultimo accordo, E, si usa il frigio dominante (Mi Fa Sol♯ La Si Do Re).","Nei Balcani sono comuni i tempi dispari: 7/8, 9/8 (2+2+2+3), 11/8. Le melodie usano spesso la minore armonica."],
   remember:"Andalusa = Am G F E · Balcani = 9/8 2+2+2+3."},
  {type:"lezione", title:"Ispirarsi, non copiare", min:2, polly:["maestra","Ascolta l'originale, poi suona la tua versione."],
   text:["Questi modelli sono ispirati a stili tradizionali, non sono trascrizioni. Ascolta musica di questi Paesi e lascia che le figure entrino nelle mani: il groove si impara soprattutto ascoltando.","Ogni tradizione ha dettagli che nessuna pagina può scrivere: il modo in cui “respira” il tempo."],
   remember:"Prima ascolta, poi suona."},

L19:{steps:[
  {type:"lezione", title:"Il basso nella musica barocca", min:4, polly:["maestra","Trecento anni fa il basso era già il capo: si chiamava basso continuo."],
   text:["Nella musica barocca il basso continuo sosteneva tutta l'armonia: una linea di basso, spesso in movimento costante, sopra la quale si costruivano gli accordi.","Le linee barocche scendono e salgono per grado, usano molti rivolti (C/E, G/B) e hanno un ritmo regolare. Sono perfette per allenare lettura e intonazione."],

/* Notazione compatta:

   durate: w semibreve · h minima · q semiminima · e ottavo · s sedicesimo · t ottavo di terzina · u semiminima di terzina; "." = puntata
   segni: x nota morta · g ghost note · H hammer-on · P pull-off · S slide · ~ vibrato · ^ accento · T pollice · O pop · Q tapping · * armonico naturale · A armonico artificiale
   gradi: :1 :b3 :3 :5 :b7 :8 :9 …   pause: rq, re., rs …   [Sigla] all'inizio della battuta   {7/8} oppure {7/8:2+2+3} cambia il tempo */

function parseBars(src, meter){
  const bars = []; const events = []; let beat = 0; let alt = 0; let pk = 0; let M = meterOf(meter);
  function mkEv(s, f, sym, dot, d, fl, deg, start, inChord){
    const ev = {s, f, sym, dot, d, deg, start, i:events.length, fl, chordTone:inChord,
      dead:fl.includes("x"), ghost:fl.includes("g"), ham:fl.includes("H"), pull:fl.includes("P"), slide:fl.includes("S"), vib:fl.includes("~"),
      acc:fl.includes("^"), thumb:fl.includes("T"), up:fl.includes("U"), pop:fl.includes("O"), tap:fl.includes("Q"), nh:fl.includes("*"), ah:fl.includes("A"), pm:fl.includes("M")};

/* Manico a pallini: corda più acuta in alto, come la tab. Per i mancini si specchia in orizzontale.

function svgBoard(pos, opt){

    else g += `<circle cx="${x}" cy="${cy}" r="3.5" fill="var(--border)"/>`;
    g += `<text x="${x}" y="${H-2}" text-anchor="middle" font-size="10" fill="var(--muted)">${f}</text>`;

  if(!AC){ AC = new (window.AudioContext || window.webkitAudioContext)(); const len = AC.sampleRate; NOISE = AC.createBuffer(1, len, AC.sampleRate); const d = NOISE.getChannelData(0); for(let i=0;i<len;i++) d[i] = Math.random()*2-1; }

const ROOTS = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};

  const m = String(sym).split("/")[0].match(/^([A-G])([#b♯♭]?)(.*)$/); if(!m) return null;
  const root = (ROOTS[m[1]] + (/[#♯]/.test(m[2])?1:/[b♭]/.test(m[2])?-1:0) + 12) % 12; const q = m[3];
  let iv;
  if(/^(maj7#5|Δ#5|maj7\+5)/.test(q)) iv = [0,4,8,11];
  else if(/^(maj|Δ|M7)/.test(q)) iv = [0,4,7,11];
  else if(/^(m7b5|m7♭5|ø)/.test(q)) iv = [0,3,6,10];
  else if(/^(dim7|°7|o7)/.test(q)) iv = [0,3,6,9];
  else if(/^(dim|°|o)/.test(q)) iv = [0,3,6];
  else if(/^(aug|\+)/.test(q)) iv = [0,4,8];
  else if(/^(m\(maj7\)|mMaj7|m\(Δ\)|mΔ)/.test(q)) iv = [0,3,7,11];
  else if(/^m6/.test(q)) iv = [0,3,7,9];
  else if(/^m(7|9|11|13)/.test(q)) iv = [0,3,7,10];
  else if(/^m/.test(q)) iv = [0,3,7];
  else if(/^(7sus|9sus|13sus)/.test(q)) iv = [0,5,7,10];
  else if(/^sus/.test(q)) iv = [0,5,7];
  else if(/^(7|9|11|13)/.test(q)) iv = [0,4,7,10];
  else if(/^6/.test(q)) iv = [0,4,7,9];
  else if(/^5/.test(q)) iv = [0,7];

/* Motore a griglia fine: 12 tick per battito (sedicesimi e terzine).
   cfg.bars = [{start, len, chord, meter}] in battiti; se manca si costruisce da cfg.chords. */
const TPB = 12;
const P = {
  on:false, timer:null, tick:0, t0:0, spb:1, cfg:null, playedSec:0, startedAt:0,
  start(cfg){
    ac(); this.stop(true); this.cfg = cfg; this.spb = 60/cfg.bpm;
    if(!cfg.bars){ const M = meterOf(cfg.meter); const ch = cfg.chords || [null,null,null,null]; cfg.bars = ch.map((c,i) => { const parts = c ? String(c).split(/\s+/) : []; return {start:i*M.len, len:M.len, chord:parts[0]||null, chords:parts.map((q,k) => ({c:q, at:k*M.len/parts.length})), meter:M}; }); cfg.beats = ch.length*M.len; }

          if(M.den===4){ if(k===0 || (k===2 && M.num>=4)) A[tk].push({a:"kick"}); if(k%2===1) A[tk].push({a:"snare"}); }
          else { if(k===0) A[tk].push({a:"kick"}); else if(gs.includes(k)) A[tk].push({a:"snare"}); }

      const cl = b.chords || []; cl.forEach((cc,k) => { const tk = s0 + Math.round(cc.at*TPB); if(tk < L) A[tk].push({a:"chord", sym:cc.c, bi:ci++, dur:((k+1<cl.length ? cl[k+1].at : b.len) - cc.at)}); });

      }

    (c.events||[]).forEach(e => { const tk = Math.round(e.start*TPB); if(tk < L) A[tk].push({a:"note", e, sw: c.swing && Math.round(e.start*TPB) % TPB === TPB/2}); });

  time(tick){ return this.t0 + (tick - this.pre) * this.spb / TPB; },
  setBpm(b){ if(!this.on) return; const tNext = this.time(this.tick); this.spb = 60/b; this.t0 = tNext - (this.tick - this.pre) * this.spb / TPB; this.cfg.bpm = b; },

  schedule(tick, t){

function tappa(id, current){
  const st = chState(id);
  if(st === "empty") return {img:"tappa_stato_bloccata", cls:"t-lock", label:""};
  if(st === "done") return mastered(id) ? {img:"tappa_completata_anello", cls:"t-ring", label:""} : {img:"tappa_completata_base", cls:"t-done", label:""};
  if(st === "progress" || current) return {img:"tappa_attuale_progress", cls:"t-cur", label:id};
  return {img:"tappa_attuale_base", cls:"t-cur", label:id};
}
function chState(id){
  const c = CONTENT[id]; if(!c) return "empty";
  const n = c.steps.filter((s,i) => S.done[stepKey(id,i)]).length;
  return n === c.steps.length ? "done" : n ? "progress" : "todo";
}
function chDone(id){ const c = CONTENT[id]; return c ? c.steps.filter((s,i) => S.done[stepKey(id,i)]).length : 0; }
function chTitle(id){ return ALLCH[id] ? ALLCH[id][1] : id; }

const pollyImg = (pose, alt) => `<img src="${POLLY[pose] || POLLY.basso}" alt="${alt || 'Polly'}">`;
const pollySay = (pose, text, big) => `<div class="polly ${big?'big':''}">${pollyImg(pose)}<div class="bubble">${text}</div></div>`;
function nav(){
  const it = [["path","Percorso"],["practice","Pratica"],["handbook","Prontuario"],["profile","Profilo"]];
  return `<nav class="nav">${it.map(([k,l]) => { const on = V.screen===k; return `<button data-a="go" data-v="${k}" class="${on?'on':''}" aria-label="${l}"${on?' aria-current="page"':''}><img class="navic" src="${ASSETS['nav_'+k+(on?'_on':'')]}" alt=""><span>${l}</span></button>`; }).join("")}</nav>`;
}
function toast(msg){ const old = document.querySelector(".toast"); if(old) old.remove(); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg; document.getElementById("phone").appendChild(t); setTimeout(() => t.remove(), 2600); }

function instrBtn(mini){ return `<button class="instr ${mini?'mini':''}" data-a="instr" aria-label="Cambia strumento">${IC.bass}${S.strings} corde${S.lefty?' · mancino':''}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:14px;height:14px"><path d="M6 9l6 6 6-6"/></svg></button>`; }
function header(){ return `<header class="appbar"><div class="brand"><img class="logo" src="${ASSETS.logo_sm}" alt="Barimnia"></div><div class="row" style="gap:6px"><span class="chip gold" title="Serie di giorni">${IC.star.replace('<svg','<svg width="14" height="14"')} ${streak()}</span>${instrBtn()}</div></header>`; }
function instrSheet(){ return `<div class="veil"><div class="sheet" role="dialog" aria-label="Strumento"><h2>Il tuo strumento</h2><p class="muted small">Cambia quando vuoi: manico, tab ed esercizi si aggiornano subito.</p>
  <div class="seg">${[4,5,6].map(n => `<button class="${S.strings===n?'on':''}" data-a="strings" data-v="${n}">${n} corde</button>`).join("")}</div>

  <button class="btn primary" data-a="instrclose">Fatto</button></div></div>`; }

plays(){

audition(){

},
path(){
  const key = S.path, P0 = PATHS[key];
  const tabs = Object.keys(PATHS).map(k => { const all = PATHS[k].ch.length, dn = PATHS[k].ch.filter(c => chState(c[0])==="done").length; return `<button class="${k===key?'on':''}" data-a="path" data-v="${k}">${PATHS[k].name} <span class="small">${dn}/${all}</span></button>`; }).join("");
  const offs = [0, 56, 84, 56, 0, -56, -84, -56];
  let html = "";
  const curIdx = P0.ch.findIndex(c => CONTENT[c[0]] && chState(c[0]) !== "done");
  P0.ch.forEach((c, i) => {
    const [id, title, lv, req] = c; const st = chState(id);
    const tp = tappa(id, i === curIdx);
    const reqTxt = req ? `<span class="req">Completa ${req}${CONTENT[id] ? " · aperto per la prova" : ""}</span>` : "";
    const stTxt = st === "empty" ? `<span class="req">In arrivo</span>` : st === "progress" ? `<span class="req">${chDone(id)}/${CONTENT[id].steps.length} passi</span>` : "";
    html += `<div class="stop" style="transform:translateX(${offs[i%8]}px)"><button class="node tappa ${tp.cls}" data-a="chapter" data-v="${id}" aria-label="${id} ${title}"><img src="${ASSETS['nav_'+tp.img]}" alt="">${tp.label ? `<span class="lbl">${tp.label}</span>` : ""}</button><span class="t"><b class="num">${id}</b> ${title}</span><span class="req">${LEVEL[lv]}</span>${reqTxt}${stTxt}${i === curIdx ? (offs[i%8] > 0 ? `<img class="pathpolly l" src="${ASSETS.polly_think}" alt="Polly ti aspetta qui">` : `<img class="pathpolly r" src="${ASSETS.polly_think_sx}" alt="Polly ti aspetta qui">`) : ""}</div>`;
    if(key === "tecnica") MODULES.filter(m => m.after === id).forEach(m => { const dn = m.ch.filter(x => chState(x[0])==="done").length;
      html += `<div class="module"><div class="mhead">${IC.branch}<b>Modulo ${m.name}</b><span class="muted small">${dn}/${m.ch.length} · completa ${id}</span></div><div class="mrow">${m.ch.map(([mid,mt,mlv]) => { const ms = chState(mid); return `<button class="mnode ${ms==='done'?'done':''}" data-a="chapter" data-v="${mid}" aria-label="${mid} ${mt}"><span class="mid tappa ${tappa(mid).cls}"><img src="${ASSETS['nav_'+tappa(mid).img]}" alt="">${tappa(mid).label ? `<span class="lbl">${mid}</span>` : ""}</span><span class="mt"><b class="num">${mid}</b> ${mt}</span><span class="ml">${LEVEL[mlv]}</span></button>`; }).join("")}</div></div>`; });
  });
  return `${header()}<div class="screen"><h1>Percorso</h1>
    <div class="seg" role="tablist">${tabs}</div><div class="path">${html}</div></div>${nav()}`;
},
chapter(){
  const id = V.p.id, c = CONTENT[id], n = c.steps.length, d = chDone(id);
  const rows = c.steps.map((s,i) => {
    const [tl, ic] = TYPE[s.type]; const done = S.done[stepKey(id,i)]; const best = S.best[stepKey(id,i)];
    let st = done ? `<span class="st ok">Completato</span>` : `<span class="st">Da fare</span>`;
    if(s.bpm && Array.isArray(s.bpm) && best) st = `<span class="st ${done?'ok':''}">${best}/${s.bpm[1]} BPM</span>`;
    return `<button class="step ${s.type==='quiz'?'final':''}" data-a="step" data-v="${i}"><span class="ic">${ic}</span><span class="grow"><span style="display:block">${s.title}</span><span class="muted small">${tl} · ${s.min} min${s.type==='quiz'?' · 80% per chiudere il capitolo':''}</span></span>${st}</button>`;
  }).join("");
  return `<div class="screen"><div class="topbar"><button class="iconbtn" data-a="go" data-v="path" aria-label="Torna al percorso">${IC.back}</button><div class="grow"><div class="muted small">${id} · ${LEVEL[ALLCH[id][2]]}${ALLCH[id][3] ? ' · completa ' + ALLCH[id][3] : ''}</div><h2>${chTitle(id)}</h2></div></div>
    <div class="row"><div class="bar"><i style="width:${d/n*100}%"></i></div><span class="muted small">${d}/${n}</span></div>
    <div class="steps">${rows}</div></div>${nav()}`;
},
step(){
  const id = V.p.id, i = V.p.i, c = CONTENT[id], s = c.steps[i];
  const seg = c.steps.map((x,k) => `<i class="${k===i?'cur':S.done[stepKey(id,k)]?'done':''}"></i>`).join("");
  const head = `<div class="topbar"><button class="iconbtn" data-a="exit" aria-label="Esci dal passo">${IC.close}</button><div class="segbar">${seg}</div>${["strumento","pratica","modello"].includes(s.type)?instrBtn(true):""}</div><div><div class="muted small">${TYPE[s.type][0]} · passo ${i+1} di ${c.steps.length}</div><h2>${s.title}</h2></div>`;
  return `<div class="screen">${head}${STEP[s.type](s, id, i)}</div>`;
},
practice(){
  const loops = {rock:["Rock in La",["A","A","D","E"],100], pop:["Pop in Do",["C","G","Am","F"],84], blues:["Blues in Mi",["E7","A7","E7","B7"],90]};

    <div class="opts">${Object.keys(loops).map(k => `<button class="${UI.loop===k?'on':''}" data-a="loop" data-v="${k}">${loops[k][0]}</button>`).join("")}</div>

},
profile(){
  const tot = Object.values(S.practice).reduce((a,b) => a+b, 0), now = (S.practice[today()]||0)/60;
  const chDoneN = Object.keys(CONTENT).filter(k => chState(k)==="done").length;

  return `${header()}<div class="screen"><div class="me">
      <label class="avatar" aria-label="Cambia foto profilo">${S.avatar ? `<img src="${S.avatar}" alt="Foto profilo">` : `<img class="ph" src="${ASSETS.avatar_polly}" alt="Polly, in attesa della tua foto">`}<span class="cam">${IC.cam}</span><input type="file" accept="image/*" id="avatarIn" hidden></label>
      <input class="myname" id="nameIn" value="${(S.name||'').replace(/"/g,'&quot;')}" placeholder="Il tuo nome" aria-label="Il tuo nome" maxlength="24">
      <span class="muted small">${S.strings} corde${S.lefty?' · mancino':''} · obiettivo ${S.goal} min al giorno</span>
    </div>
    <div class="tiles"><div class="tile"><b>${fmtMin(tot)}</b><span>Minuti di pratica</span></div><div class="tile"><b>${streak()} giorni</b><span>Serie</span></div>
    <div class="tile"><b>${Math.floor(now)} di ${S.goal} min</b><span>Oggi</span><div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,now/S.goal*100)}%;background:var(--gold)"></i></div></div><div class="tile"><b>${chDoneN} / 45</b><span>Capitoli completati</span></div></div>
    <div class="card stack"><h3>Sfida della settimana</h3><p class="small">Porta “Il tuo primo groove” a 100 BPM.</p><div class="row"><div class="bar"><i style="width:${Math.min(100,best/100*100)}%"></i></div><span class="muted small">${best||0}/100</span></div></div>
    <div class="card stack"><h3>Strumento</h3>
      <div class="seg">${[4,5,6].map(n => `<button class="${S.strings===n?'on':''}" data-a="strings" data-v="${n}">${n} corde</button>`).join("")}</div>
      <div class="toggle"><span>Suono da mancino</span><button class="switch ${S.lefty?'on':''}" data-a="lefty" role="switch" aria-checked="${S.lefty}" aria-label="Suono da mancino"></button></div></div>
    <div class="card stack"><h3>Obiettivo giornaliero</h3><div class="seg">${[10,15,30].map(m => `<button class="${S.goal===m?'on':''}" data-a="goal" data-v="${m}">${m} min</button>`).join("")}</div></div>
    <div class="card"><div class="toggle"><span><b>Modalità rigorosa</b><br><span class="muted small">Un capitolo si chiude solo quando tutti gli esercizi sono “pulito” al BPM obiettivo.</span></span><button class="switch ${S.rigor?'on':''}" data-a="rigor" role="switch" aria-checked="${S.rigor}" aria-label="Modalità rigorosa"></button></div></div>
    <button class="btn secondary" data-a="go" data-v="plays">Rifai l'audizione</button>
    <button class="btn secondary" data-a="reset">Azzera i progressi (prototipo)</button><p class="muted small" style="text-align:center;margin-top:6px">Basi musicali realizzate con iReal Pro.</p></div>${nav()}`;
}
};

function metroBlock(bpm, o){
  o = o || {};
  const opt = UI.opt || (UI.opt = {click:true, example:false, base:true});
  return `<div class="card metro">
    <div class="bpm"><button class="round" data-a="bpm" data-v="-5" aria-label="Meno 5 BPM">−5</button><div><b id="bpmv">${bpm}</b><small>BPM</small></div><button class="round" data-a="bpm" data-v="5" aria-label="Più 5 BPM">+5</button></div>
    <div class="beats" id="beats">${"<i></i>".repeat(o.dots||4)}</div>
    <div class="opts"><button class="${opt.click?'on':''}" data-a="opt" data-v="click">Click</button>${o.free||o.noex?'':`<button class="${opt.example?'on':''}" data-a="opt" data-v="example">Ascolta l'esempio</button>`}${o.base?`<button class="${opt.base?'on':''}" data-a="opt" data-v="base">Base</button>`:''}</div>
    <button class="btn primary go" id="gobtn" data-a="${o.free?'freego':'go-ex'}">${P.on?IC.stop+' Ferma':IC.play+' Avvia'}</button></div>`;
}

const STEP = {
lezione(s, id, i){
  const pos = s.board ? boardPositions(s.board) : null;
  return `${s.text.map(t => `<p>${t}</p>`).join("")}
    ${s.remember ? `<div class="remember"><b>Da ricordare</b>${s.remember}</div>` : ""}
    ${pos ? `<div class="notation">${svgBoard(pos, {letters:s.letters})}</div>` : ""}
    ${s.refs ? `<div class="opts">${["E","A","D","G"].map(k => `<button data-a="ref" data-v="${k}">Ascolta il ${STRNAME[k]}</button>`).join("")}</div>` : ""}
    ${pollySay(s.polly[0], s.polly[1])}
    <div class="sticky"><button class="btn primary" data-a="next">Avanti</button></div>`;
},
app(s, id, i){ return quizView(s, id, i); },
quiz(s, id, i){ return quizView(s, id, i); },
strumento(s, id, i){ return exView(s, id, i); },
pratica(s, id, i){ return exView(s, id, i); },
modello(s, id, i){ return exView(s, id, i); },
crea(s, id, i){
  const r = s.recipe; UI.chk = UI.chk || s.checklist.map(() => false); UI.bpm = UI.bpm || s.bpm;
  const all = UI.chk.every(Boolean);
  return `<div class="card recipe"><dl style="margin:0">
      <dt>Base</dt><dd>${r.base}</dd><dt>Ingredienti</dt><dd>${r.ing}</dd>
      <dt>Regole</dt><dd><ol>${r.rules.map(x => `<li>${x}</li>`).join("")}</ol></dd><dt>Obiettivo</dt><dd>${r.goal}</dd></dl>
      <details style="margin-top:10px"><summary class="muted small" style="cursor:pointer;min-height:32px">Aiuto</summary><p class="small" style="margin-top:6px">${r.help}</p></details></div>
    <div class="chords" id="chords">${s.chords.flatMap(c => c.split(/\s+/)).map((c,j) => `<span data-c="${j}">${c}</span>`).join("")}</div>
    ${metroBlock(UI.bpm || s.bpm, {base:true, noex:true})}${BASEMAP[stepKey(id,i)] && !s.nobase ? `<p class="muted small" style="margin-top:-4px">Base iReal Pro registrata a ${BASEMAP[stepKey(id,i)].bpm} BPM, con count-in. Il click si spegne quando suona la base. Cambia il tempo con −5 / +5.</p>` : ""}
    <button class="btn secondary" data-a="rec">Registra</button>
    ${pollySay("cuffie","Registrati e riascoltati: le orecchie non mentono.")}
    <div class="card"><h3 style="margin-bottom:4px">Checklist</h3>${s.checklist.map((t,k) => `<label class="check"><input type="checkbox" id="chk${k}" data-a="chk" data-v="${k}" ${UI.chk[k]?'checked':''}><span>${t}</span></label>`).join("")}</div>
    <div class="sticky"><button class="btn primary" data-a="finish" ${all?'':'disabled'}>Ho finito</button></div>`;
}
};

function exView(s, id, i){
  const k = stepKey(id,i); const parsed = UI.parsed || (UI.parsed = parseBars(s.bars, s.meter));
  UI.view = UI.view || "tab"; UI.bpm = UI.bpm || s.bpm[0];
  const best = S.best[k];
  const views = [["tab","Tab"],["staff","Pentagramma"],["pallini","Pallini"]];
  let not = UI.view === "pallini" ? svgBoard(parsed.events) : UI.view === "tab" ? svgTab(parsed, {rh:s.rh}) : svgStaff(parsed, {flats:s.flats, swing:s.swing});
  if(s.hide && !UI.reveal) not = `<div style="padding:22px 8px;text-align:center"><p class="muted small" style="margin-bottom:10px">La soluzione è nascosta: prima trovala a orecchio sullo strumento.</p><button class="btn sm secondary" data-a="reveal">Mostra la soluzione</button></div>`;
  if(s.hide && UI.exInit !== k){ UI.opt = UI.opt || {click:true, example:false, base:true}; UI.opt.example = true; UI.exInit = k; }
  const chords = parsed.bars.some(b => b.chords) && !(s.hide && !UI.reveal) ? `<div class="chords" id="chords">${parsed.bars.flatMap(b => (b.chords||[]).map(x => x.c)).map((c,j) => `<span data-c="${j}">${c}</span>`).join("")}</div>` : "";
  const ev = S.evals[k] || []; const last2 = ev.slice(-2);
  const propose = !UI.noPropose && last2.length===2 && last2.every(e => e.r==="g") && UI.bpm < s.bpm[1];
  return `<p>${s.task}</p>
    <div class="row" style="flex-wrap:wrap;gap:6px"><span class="chip">Partenza ${s.bpm[0]}</span><span class="chip gold">Obiettivo ${s.bpm[1]} BPM</span>${best?`<span class="chip">Record ${best}</span>`:""}</div>
    <div class="seg" role="tablist" aria-label="Vista">${views.map(([v,l]) => `<button class="${UI.view===v?'on':''}" data-a="view" data-v="${v}">${l}</button>`).join("")}</div>
    ${chords}<div class="notation" id="not">${not}</div>${s.tip?`<div class="remember"><b>Consiglio</b>${s.tip}</div>`:""}
    ${propose ? `<div class="banner info"><img src="${POLLY.carica}" alt="" style="width:56px;height:auto"><span class="grow">Due volte pulito! Alziamo di 5 BPM?</span><button class="btn sm primary" data-a="plus5">Sì</button><button class="btn sm secondary" data-a="nopropose">Non ancora</button></div>` : ""}
    ${metroBlock(UI.bpm, {base: !!chords})}${BASEMAP[k] && !s.nobase ? `<p class="muted small" style="margin-top:-4px">Base iReal Pro registrata a ${BASEMAP[k].bpm} BPM, con count-in. Il click si spegne quando suona la base. Cambia il tempo con −5 / +5.</p>` : ""}
    ${pollySay(s.type==="modello"?"cuffie":"conta", s.type==="modello" ? "Ascolta l'esempio, poi tocca a te." : "Lento e pulito batte veloce e sporco. Sempre.")}
    <div class="sticky"><button class="btn primary" data-a="next" ${S.done[k]?'':'disabled'}>${S.done[k]?'Continua':'Segna com\'è andata per continuare'}</button></div>`;
}
function quizView(s, id, i){
  const Q = UI.q || (UI.q = {k:0, sel:null, checked:false, score:0, end:false});
  if(Q.end){
    const pct = Math.round(Q.score / s.questions.length * 100), pass = s.type!=="quiz" || pct >= 80;
    return `${pollySay(pass?(s.type==="quiz"?"festa":"felice"):"triste", pass ? (s.type==="quiz"?"Capitolo in tasca! Barimnia approva.":"Esatto! Orecchio da bassista.") : "Ci sei quasi. La seconda volta suona sempre meglio.", true)}
      <div style="text-align:center"><h1>${pass ? (s.type==="quiz"?"Capitolo superato!":"Fatto!") : "Ci sei quasi"}</h1><p class="muted">${Q.score} su ${s.questions.length} (${pct}%)${s.type==="quiz"&&!pass?" · ti serve l'80% per chiudere il capitolo":""}</p></div>
      <div class="sticky stack">${pass?`<button class="btn primary" data-a="quizdone">Continua</button>`:`<button class="btn primary" data-a="quizretry">Riprova</button><button class="btn secondary" data-a="exit">Rivedi il capitolo</button>`}</div>`;
  }
  const q = s.questions[Q.k];
  /* ordine delle risposte mescolato a ogni tentativo: la giusta non è sempre la prima */
  Q.ord = Q.ord || {}; const ord = Q.ord[Q.k] || (Q.ord[Q.k] = q.o.map((_,j) => j).map(j => [Math.random(), j]).sort((a,b) => a[0]-b[0]).map(x => x[1]));
  const opts = ord.map(j => [q.o[j], j]).map(([o,j]) => { let cls = Q.sel===j ? "on" : ""; if(Q.checked){ if(j===q.c) cls = "ok"; else if(j===Q.sel) cls = "ko"; } return `<button class="opt ${cls}" data-a="pick" data-v="${j}" ${Q.checked?'disabled':''} style="text-align:left;padding:14px">${o}</button>`; }).join("");
  const right = Q.checked && Q.sel === q.c;
  return `<div class="muted small">Domanda ${Q.k+1} di ${s.questions.length}</div><h3 style="font-size:18px">${q.q}</h3>${q.play ? `<button class="btn secondary" data-a="qplay">${IC.play} Ascolta${q.harm?' (insieme)':''}</button>` : ""}
    <div class="stack">${opts}</div>
    ${Q.checked ? `<div class="banner ${right?'good':'bad'}"><img src="${POLLY[right?'felice':'triste']}" alt="" style="width:46px;height:auto">${right?IC.check:IC.cross}<span><b>${right?'Giusto!':'Quasi!'}</b> ${right?'':'La risposta è: '+q.o[q.c]+'.'}</span></div>` : ""}
    <div class="sticky">${Q.checked ? `<button class="btn primary" data-a="qnext">Continua</button>` : `<button class="btn primary" data-a="qcheck" ${Q.sel===null?'disabled':''}>Verifica</button>`}</div>`;
}
function evalSheet(){
  const s = CONTENT[V.p.id].steps[V.p.i]; const E = UI.eval;
  return `<div class="veil"><div class="sheet" role="dialog" aria-label="Autovalutazione"><h2>Com'è andata?</h2>
    <div class="evals"><button class="g ${E.r==='g'?'on':''}" data-a="er" data-v="g">${IC.check}Pulito</button><button class="a ${E.r==='a'?'on':''}" data-a="er" data-v="a">${IC.dash}Quasi</button><button class="r ${E.r==='r'?'on':''}" data-a="er" data-v="r">${IC.cross}Da rifare</button></div>
    <div class="row"><span class="grow">BPM raggiunto</span><button class="round" data-a="ebpm" data-v="-5" aria-label="Meno 5">−5</button><b style="font-size:22px;min-width:48px;text-align:center">${E.bpm}</b><button class="round" data-a="ebpm" data-v="5" aria-label="Più 5">+5</button></div>
    ${S.rigor ? `<p class="muted small">Modalità rigorosa: il passo si completa con “pulito” a ${s.bpm[1]} BPM.</p>` : ""}
    <button class="btn primary" data-a="esave" ${E.r?'':'disabled'}>Salva</button><button class="btn secondary" data-a="eclose">Annulla</button></div></div>`;
}

/* ---------- Disegno e azioni ---------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = SCREENS[V.screen]() + (UI.eval ? evalSheet() : "") + (UI.instr ? instrSheet() : "") + `<div class="rotate" role="alert"><img src="${ASSETS.polly_think_sx}" alt=""><h2>Gira il telefono</h2><p class="muted">Barimnia si usa in verticale.</p></div>`;
  const sc = app.querySelector(".screen"); if(sc && UI.scroll){ sc.scrollTop = UI.scroll; UI.scroll = 0; }
  if(V.screen === "path") requestAnimationFrame(drawTrail);
}
/* Traccia del percorso: una linea curva che collega i capitoli, piena fin dove sei arrivato */
function drawTrail(){
  const box = document.querySelector(".path"); if(!box) return;
  const old = box.querySelector(".trail"); if(old) old.remove();
  const b = box.getBoundingClientRect();
  const nodes = [...box.querySelectorAll(".stop .node")]; if(nodes.length < 2) return;
  const pts = nodes.map(n => { const r = n.getBoundingClientRect(); return [r.left - b.left + r.width/2, r.top - b.top + r.height/2, n.classList.contains("done")]; });
  let d = `M${pts[0][0]} ${pts[0][1]}`, dDone = ""; let lastDone = -1; pts.forEach((p,i) => { if(p[2]) lastDone = i; });
  const seg = (a, c) => { const my = (a[1] + c[1]) / 2; return ` C${a[0]} ${my} ${c[0]} ${my} ${c[0]} ${c[1]}`; };
  for(let i = 1; i < pts.length; i++) d += seg(pts[i-1], pts[i]);
  if(lastDone > 0){ dDone = `M${pts[0][0]} ${pts[0][1]}`; for(let i = 1; i <= lastDone; i++) dDone += seg(pts[i-1], pts[i]); }
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "trail"); svg.setAttribute("width", b.width); svg.setAttribute("height", box.scrollHeight);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="var(--border)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 16"/>` + (dDone ? `<path d="${dDone}" fill="none" stroke="var(--gold)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 16"/>` : "");
  box.prepend(svg);
}
window.addEventListener("resize", () => { if(V.screen === "path") drawTrail(); });
try { if(screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(() => {}); } catch(e) {}
function go(screen, p){ P.stop(); UI = {}; V = {screen, p: p || {}}; render(); const sc = document.querySelector(".screen"); if(sc) sc.scrollTop = 0; }
function rerender(){ const sc = document.querySelector(".screen"); UI.scroll = sc ? sc.scrollTop : 0; render(); }
function curStep(){ return CONTENT[V.p.id].steps[V.p.i]; }
function markDone(){ S.done[stepKey(V.p.id, V.p.i)] = true; save(); }
function nextStep(){ const c = CONTENT[V.p.id]; if(V.p.i + 1 < c.steps.length) go("step", {id:V.p.id, i:V.p.i+1}); else { go("chapter", {id:V.p.id}); if(chState(V.p.id)==="done") toast("Capitolo completato! Nuove tappe si apriranno qui."); } }

function hiNote(e){
  document.querySelectorAll(".n-dot.on,.n-ev.on,.n-note.on").forEach(x => x.classList.remove("on"));
  if(!e) return;
  const el = document.querySelector(`.n-ev[data-i="${e.i}"],.n-note[data-i="${e.i}"],.n-dot[data-pos="${e.s+e.f}"]`); if(el) el.classList.add("on");
  if(el && !el.classList.contains("n-dot")) follow(document.getElementById("not"), el);
}
/* Scorrimento automatico: la nota che suona resta a circa un terzo della larghezza */
function follow(box, el){
  if(!box || box.scrollWidth <= box.clientWidth + 4) return;
  const b = box.getBoundingClientRect(), r = el.getBoundingClientRect();
  const target = box.scrollLeft + (r.left + r.width/2 - b.left) - box.clientWidth * 0.33;
  const max = box.scrollWidth - box.clientWidth, to = Math.max(0, Math.min(max, target));
  if(Math.abs(to - box.scrollLeft) < 8) return;
  box.scrollTo({left: to, behavior: to < box.scrollLeft - box.clientWidth/2 ? "auto" : "smooth"});
}
function hiBeat(b, n){ const box = document.getElementById("beats"); if(!box) return; if(n && box.children.length !== n) box.innerHTML = "<i></i>".repeat(n); [...box.children].forEach((x,k) => x.classList.toggle("on", k===b)); }
function hiChord(j){ let cur = null; document.querySelectorAll("#chords span").forEach((x,k) => { x.classList.toggle("on", k===j); if(k===j) cur = x; }); if(cur) follow(document.getElementById("chords"), cur); }

/* Basi iReal Pro: un file per base, con una battuta di count-in e il finale. Il tempo si cambia con playbackRate (intonazione invariata). */
const BASE = {a:null, info:null, failed:{}};
function baseInfo(){ const s = curStep(); if(!s || s.nobase) return null; return BASEMAP[stepKey(V.p.id, V.p.i)] || null; }
function baseAudio(info){
  if(!BASE.a){ BASE.a = new Audio(); BASE.a.preload = "auto"; BASE.a.addEventListener("ended", () => { if(P.on && P.cfg && P.cfg.real){ ACT["go-ex"](); } }); }
  const src = "basi/" + info.file.replace(/\.wav$/, ".mp3");
  if(BASE.a.getAttribute("src") !== src){ BASE.a.setAttribute("src", src); BASE.a.load(); }
  BASE.a.preservesPitch = true; BASE.a.mozPreservesPitch = true; BASE.a.webkitPreservesPitch = true;
  return BASE.a;
}
function exCfg(){
  const s = curStep();
  if(s.type === "crea") return {bpm:UI.bpm || s.bpm, chords:s.chords, meter:s.meter, swing:s.swing, base:UI.opt.base, click:UI.opt.click, example:false, events:[], onBeat:hiBeat, onChord:hiChord};
  const parsed = UI.parsed; const chords = parsed.bars.some(b => b.chords) ? parsed.bars.map(b => b.chord) : null;
  return {bpm:UI.bpm, beats:parsed.beats, bars:parsed.bars, chords, swing:s.swing, base:!!chords && UI.opt.base, click:UI.opt.click, example:UI.opt.example, events:parsed.events, onBeat:hiBeat, onNote:hiNote, onChord:hiChord};
}
function startExercise(){
  const cfg = exCfg(); const info = baseInfo();
  if(!(info && UI.opt.base && !BASE.failed[info.file])){ P.start(cfg); return; }
  ac(); const a = baseAudio(info); const rate = cfg.bpm / info.bpm;
  a.playbackRate = rate; a.currentTime = 0;
  cfg.base = false; cfg.click = false; cfg.real = true; cfg.info = info; cfg.onStop = () => { a.pause(); };
  P.cfg = cfg; P.on = true; P.startedAt = Date.now(); /* il pulsante mostra già "Ferma" mentre il file parte */
  a.play().then(() => {
    if(!P.on) { a.pause(); return; }
    P.on = false; P.cfg = null; cfg.at = AC.currentTime - a.currentTime / rate + (AC.outputLatency || 0);
    P.start(cfg);
  }).catch(() => { BASE.failed[info.file] = true; P.on = false; P.cfg = null; cfg.real = false; cfg.base = UI.opt.base; cfg.onStop = null; P.start(cfg); toast("Base non disponibile: suona quella sintetica."); });
}
const ACT = {
  go(v){ if(v==="path" || v==="practice" || v==="handbook" || v==="profile"){ if(!S.setup){ S.setup = true; save(); } } go(v); },
  start(){ S.setup = true; save(); go("path"); },
  strings(v){ S.strings = +v; save(); rerender(); },
  lefty(){ S.lefty = !S.lefty; save(); rerender(); },
  instr(){ UI.instr = true; rerender(); },
  instrclose(){ UI.instr = false; rerender(); },
  goal(v){ S.goal = +v; save(); rerender(); },
  rigor(){ S.rigor = !S.rigor; save(); rerender(); },
  path(v){ S.path = v; save(); render(); },
  chapter(v){ if(CONTENT[v]) go("chapter", {id:v}); else toast(`${v} · ${chTitle(v)}: in arrivo, dopo la prova sullo strumento.`); },
  step(v){ go("step", {id:V.p.id, i:+v}); },
  exit(){ go("chapter", {id:V.p.id}); },
  next(){ const s = curStep(); if(s.type === "lezione") markDone(); nextStep(); },
  view(v){ UI.view = v; rerender(); },
  reveal(){ UI.reveal = true; rerender(); },
  qplay(){ const s = curStep(), q = s.questions[UI.q.k]; ac(); const t0 = AC.currentTime + .05;
    q.play.forEach((m,j) => { const t = q.harm ? t0 : t0 + j*.55; if(m >= 52){ const o = AC.createOscillator(), g = AC.createGain(); o.type = "triangle"; o.frequency.value = hz(m); env(g, t, .01, .2, q.harm ? 1.6 : .6); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 2); } else bassNote(m, t, q.harm ? 1.6 : .55); }); },
  opt(v){ UI.opt[v] = !UI.opt[v]; if(P.on){ P.cfg.click = UI.opt.click && !P.cfg.real; P.cfg.example = UI.opt.example; if(P.cfg.real){ if(v==='base' && !UI.opt.base && BASE.a) BASE.a.muted = true; if(v==='base' && UI.opt.base && BASE.a) BASE.a.muted = false; } else P.cfg.base = UI.opt.base && !!P.cfg.chords; } rerender(); },
  bpm(v){ UI.bpm = Math.min(240, Math.max(30, (UI.bpm || (UI.free && UI.free.bpm) || 60) + (+v))); if(UI.free) UI.free.bpm = UI.bpm; P.setBpm(UI.bpm); if(P.on && P.cfg && P.cfg.real && BASE.a) BASE.a.playbackRate = UI.bpm / P.cfg.info.bpm; const b = document.getElementById("bpmv"); if(b) b.textContent = UI.bpm; },
  "go-ex"(){
    if(P.on){ P.stop(); hiNote(null); hiBeat(-1); hiChord(-1); const s = curStep(); if(s.type !== "crea" && P.playedSec > 3){ UI.eval = {r:null, bpm:UI.bpm}; } rerender(); return; }
    startExercise(); const b = document.getElementById("gobtn"); if(b) b.innerHTML = IC.stop + " Ferma";
  },
  freego(){
    if(P.on){ P.stop(); hiBeat(-1); hiChord(-1); rerender(); return; }
    const loops = {rock:["A","A","D","E"], pop:["C","G","Am","F"], blues:["E7","A7","E7","B7"]};
    UI.bpm = UI.free.bpm; P.start({bpm:UI.free.bpm, chords:loops[UI.loop], base:UI.opt.base, click:UI.opt.click, events:[], onBeat:hiBeat, onChord:hiChord});
    const b = document.getElementById("gobtn"); if(b) b.innerHTML = IC.stop + " Ferma";
  },
  loop(v){ P.stop(); UI.loop = v; UI.free = {bpm: {rock:100, pop:84, blues:90}[v]}; rerender(); },
  ref(v){ ac(); bassNote(OPEN[v], AC.currentTime + .05, 1.6); },
  er(v){ UI.eval.r = v; rerender(); },
  ebpm(v){ UI.eval.bpm = Math.max(30, UI.eval.bpm + (+v)); rerender(); },
  eclose(){ UI.eval = null; rerender(); },
  esave(){
    const s = curStep(), k = stepKey(V.p.id, V.p.i), E = UI.eval;
    (S.evals[k] = S.evals[k] || []).push({r:E.r, bpm:E.bpm, t:Date.now()});
    if(E.r === "g") S.best[k] = Math.max(S.best[k] || 0, E.bpm);
    const ok = S.rigor ? (E.r === "g" && E.bpm >= s.bpm[1]) : true; if(ok) S.done[k] = true;
    save(); UI.eval = null; UI.noPropose = false; rerender();
    if(!ok) toast(`Salvato. In modalità rigorosa serve “pulito” a ${s.bpm[1]} BPM.`);
    else if(E.r === "r") toast("Salvato. Polly lo rimette nel ripasso di domani.");
  },
  plus5(){ UI.bpm = Math.min(240, UI.bpm + 5); UI.noPropose = true; rerender(); },
  nopropose(){ UI.noPropose = true; rerender(); },
  pick(v){ UI.q.sel = +v; rerender(); },
  qcheck(){ const s = curStep(), Q = UI.q; Q.checked = true; if(Q.sel === s.questions[Q.k].c) Q.score++; rerender(); },
  qnext(){ const s = curStep(), Q = UI.q; if(Q.k + 1 < s.questions.length){ Q.k++; Q.sel = null; Q.checked = false; } else Q.end = true; rerender(); },
  quizdone(){ markDone(); nextStep(); },
  quizretry(){ UI.q = null; rerender(); },
  chk(v, el){ UI.chk[+v] = el.checked; rerender(); },
  finish(){ P.stop(); markDone(); nextStep(); },
  rec(){ toast("La registrazione arriva nell'app: qui il browser non dà accesso al microfono."); },
  reset(){ const keep = {strings:S.strings, lefty:S.lefty, goal:S.goal, name:S.name, avatar:S.avatar}; S = Object.assign({}, DEF, keep, {setup:true}); save(); toast("Progressi azzerati."); go("profile"); }
};
document.getElementById("app").addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if(!el || el.disabled) return;
  if(el.dataset.a === "chk") return;
  const f = ACT[el.dataset.a]; if(f) f(el.dataset.v, el);
});
document.getElementById("app").addEventListener("change", e => {
  if(e.target.id === "nameIn"){ S.name = e.target.value.trim(); save(); return; }
  if(e.target.id === "avatarIn" && e.target.files[0]){ const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"), n = 256, s = Math.min(im.width, im.height); c.width = c.height = n; c.getContext("2d").drawImage(im, (im.width-s)/2, (im.height-s)/2, s, s, 0, 0, n, n); S.avatar = c.toDataURL("image/jpeg", .85); save(); rerender(); toast("Foto aggiornata!"); }; im.src = r.result; }; r.readAsDataURL(e.target.files[0]); return; } const el = e.target.closest('[data-a="chk"]'); if(el) ACT.chk(el.dataset.v, el); });
render();
</script>
