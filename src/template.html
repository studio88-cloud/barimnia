<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barimnia – Prototipo</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B1428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barimnia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette e font di Musagete. Layout: un telefono 390x844 al centro, schermate che scorrono, barra in basso fissa. */
  --bg:#1B1428; --surface:#2A1F42; --surface-2:#34285199; --violet:#7C3AED; --violet-dark:#4C1D95;
  --lavender:#C28AE3; --gold:#CDB171; --text:#F5F3FF; --muted:#B8ABD6; --border:#4C3A7A;
  --green:#22C55E; --red:#EF4444; --amber:#F59E0B; --blue:#3B82F6;
  --deg1:#E3B34B; --deg5:#9B6BD0; --deg8:#C28AE3; --d3:#E8955E; --d7:#6FA8DC; --d9:#5FBF9F;
  --font:'Nunito', ui-rounded, 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#120D1C;color:var(--text);font-family:var(--font);font-weight:600;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-weight:700;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lavender);outline-offset:2px}
.phone{width:390px;height:844px;max-height:100%;max-width:100%;background:var(--bg);border-radius:28px;border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:440px),(max-height:720px){.phone{border:0;border-radius:0;width:100%;height:100%}}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
.screen > *{flex-shrink:0}
.btn svg,.round svg{width:20px;height:20px;flex:none}
.screen.center{justify-content:center;text-align:center}
h1{font-size:26px;font-weight:800;margin:0;text-wrap:balance}
h2{font-size:21px;font-weight:800;margin:0;text-wrap:balance}
h3{font-size:16px;font-weight:800;margin:0}
p{margin:0;line-height:1.5;color:var(--text)}
.muted{color:var(--muted);font-size:14px}
.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{min-height:52px;border-radius:14px;border:0;padding:0 18px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--violet);box-shadow:0 4px 0 var(--violet-dark)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--violet-dark)}
.btn.secondary{background:transparent;border:2px solid var(--border)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.sm{min-height:44px;font-size:14px;width:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--violet);color:var(--text)}
.topbar{display:flex;align-items:center;gap:10px;min-height:48px}
.iconbtn{width:48px;height:48px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:24px;height:24px}
.bar{height:10px;border-radius:999px;background:var(--surface);overflow:hidden;flex:1}
.bar > i{display:block;height:100%;background:var(--green);border-radius:999px}
.segbar{display:flex;gap:4px;flex:1}
.segbar i{flex:1;height:8px;border-radius:999px;background:var(--surface)}
.segbar i.done{background:var(--green)}
.segbar i.cur{background:var(--lavender)}
.polly{display:flex;align-items:flex-end;gap:10px}
.polly img{width:96px;height:auto;flex:none}
.polly.big{flex-direction:column;align-items:center}
.polly.big img{width:230px}
.bubble{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:14px;line-height:1.4}
.polly.big .bubble{border-radius:16px}
.remember{border-left:4px solid var(--gold);background:#CDB1711A;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.remember b{color:var(--gold);display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.nav{display:flex;border-top:1px solid var(--border);background:var(--bg);padding:6px 6px 10px}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);min-height:52px;justify-content:center;border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--lavender)}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:12px 8px;min-height:56px;text-align:center;font-size:15px}
.opt.on{border-color:var(--lavender);background:#C28AE322}
.opt .muted{font-size:11.5px;margin-top:4px;display:block}
.opt.ok{border-color:var(--green);background:#22C55E22}
.opt.ko{border-color:var(--red);background:#EF444422}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:var(--border);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:left .15s}
.switch.on{background:var(--violet)}
.switch.on::after{left:25px}
/* Percorso */
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:6px 0 10px;position:relative}
.path > *:not(.trail){position:relative;z-index:1}
.trail{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.node.tappa{background:none;box-shadow:none;overflow:visible}
.tappa{position:relative}
.tappa img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.node.tappa.t-cur img{width:124px}.node.tappa.t-done img,.node.tappa.t-lock img{width:78px}.node.tappa.t-ring img{width:88px}
.tappa .lbl{position:relative;z-index:1;color:#fff;font-weight:800;font-size:18px}
.mnode .mid.tappa{background:none;box-shadow:none;width:40px;height:40px}
.mnode .mid.tappa.t-cur img{width:66px}.mnode .mid.tappa.t-done img,.mnode .mid.tappa.t-lock img{width:41px}.mnode .mid.tappa.t-ring img{width:47px}
.mnode .mid .lbl{font-size:12px}
.stop .t .num,.mnode .mt .num{color:var(--lavender);font-weight:800;margin-right:2px}
.stop{position:relative}
.pathpolly{position:absolute;top:-8px;width:112px;height:auto;pointer-events:none;animation:pollyfloat 3s ease-in-out infinite}
.pathpolly.l{left:-74px}.pathpolly.r{left:136px}
@keyframes pollyfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){.pathpolly{animation:none}}
.rotate{display:none}
@media (orientation: landscape) and (max-height: 520px) and (pointer: coarse){
  .rotate{display:flex;position:fixed;inset:0;z-index:999;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
  .rotate img{width:120px;height:auto}
}
.stop{display:flex;flex-direction:column;align-items:center;gap:6px;width:180px;text-align:center}
.node{width:76px;height:76px;border-radius:50%;border:0;background:var(--violet);box-shadow:0 5px 0 var(--violet-dark);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;position:relative}
.node.done{background:var(--gold);box-shadow:0 5px 0 #8f7a45;color:#1B1428}
.node.empty{background:var(--surface);box-shadow:0 5px 0 #20172f;color:var(--muted)}
.node .lock{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.node .lock svg{width:14px;height:14px}
.stop .t{font-size:14px;line-height:1.25}
.stop .req{font-size:11.5px;color:var(--muted)}
.module{width:100%;max-width:340px;background:var(--surface);border:1px dashed var(--border);border-radius:16px;padding:10px 10px 12px}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px}.mhead svg{width:18px;height:18px;flex:none;color:var(--lavender)}.mhead .muted{margin-left:auto}
.mrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.mnode{flex:none;width:96px;min-height:96px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 6px;text-align:center;font-family:inherit}
.mnode .mid{width:36px;height:36px;border-radius:50%;background:var(--violet);box-shadow:0 3px 0 var(--violet-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.mnode.done .mid{background:var(--green);box-shadow:0 3px 0 #15803d}.mnode .mid svg{width:18px;height:18px}
.mnode .mt{font-size:11.5px;font-weight:700;line-height:1.2}.mnode .ml{font-size:10.5px;color:var(--muted)}
.branch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:8px 12px;max-width:300px;line-height:1.35}
.branch svg{width:18px;height:18px;flex:none}
/* Capitolo */
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;min-height:64px;text-align:left;width:100%}
.step .ic{width:40px;height:40px;border-radius:12px;background:#7C3AED33;display:flex;align-items:center;justify-content:center;flex:none}
.step .ic svg{width:22px;height:22px}
.step .st{font-size:12px;color:var(--muted);text-align:right;flex:none}
.step .st.ok{color:var(--green)}
.step.final{border:2px solid var(--gold)}
/* Notazione */
.notation{background:#140F1F;border:1px solid var(--border);border-radius:14px;padding:10px 6px;overflow-x:auto}
.notation svg{display:block}
.n-dot circle{transition:r .08s}
.n-dot.on circle{stroke:var(--text);stroke-width:3}
.n-ev.on rect{fill:var(--lavender)}
.n-ev.on text{fill:#1B1428}
.n-note.on ellipse{fill:var(--lavender);stroke:var(--lavender)}
.chords{display:flex;gap:6px;flex-wrap:wrap}
.chords span{border:1px solid var(--border);border-radius:8px;padding:2px 10px;font-size:14px}
.chords span.on{background:var(--violet);border-color:var(--violet)}
/* Metronomo */
.metro{display:flex;flex-direction:column;gap:12px;align-items:center}
.bpm{display:flex;align-items:center;gap:14px}
.bpm b{font-size:44px;font-weight:800;min-width:96px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.bpm small{display:block;font-size:12px;color:var(--muted);text-align:center}
.round{width:52px;height:52px;border-radius:50%;border:2px solid var(--border);background:transparent;font-size:16px}
.beats{display:flex;gap:10px}
.beats i{width:12px;height:12px;border-radius:50%;background:var(--border)}
.beats i:first-child{width:16px;height:16px;margin-top:-2px}
.beats i.on{background:var(--lavender)}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opts button{border:1px solid var(--border);background:transparent;border-radius:999px;padding:0 12px;min-height:36px;font-size:13px;color:var(--muted)}
.opts button.on{border-color:var(--lavender);color:var(--text);background:#C28AE322}
.go{width:100%}
/* Foglio dal basso */
.veil{position:absolute;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--surface);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:18px 16px 22px;width:100%;display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.switch::after{transition:none}}
.evals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.evals button{border-radius:14px;border:2px solid var(--border);background:transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px}
.evals button svg{width:20px;height:20px}
.evals .g.on{border-color:var(--green);background:#22C55E26}
.evals .a.on{border-color:var(--amber);background:#F59E0B26}
.evals .r.on{border-color:var(--red);background:#EF444426}
.banner{border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;font-size:14px}
.banner.good{background:#22C55E22;border:1px solid var(--green)}
.banner.bad{background:#EF444422;border:1px solid var(--red)}
.banner.info{background:#3B82F622;border:1px solid var(--blue)}
.banner svg{width:22px;height:22px;flex:none}
.recipe dt{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.recipe dd{margin:2px 0 0;line-height:1.45;font-size:14.5px}
.recipe ol{margin:2px 0 0;padding-left:20px;line-height:1.45;font-size:14.5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14.5px;line-height:1.4;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--violet);flex:none;margin:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
.tile b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--surface);border:1px solid var(--lavender);border-radius:14px;padding:12px 14px;font-size:14px;z-index:6}
.sticky{position:sticky;bottom:-24px;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 0;margin-top:auto}
.wordmark{font-size:40px;font-weight:800;letter-spacing:.01em;background:linear-gradient(90deg,var(--gold),var(--lavender));-webkit-background-clip:text;background-clip:text;color:transparent}
.proto{font-size:11.5px;color:var(--muted);text-align:center}
.me{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 2px}
.avatar{position:relative;overflow:visible;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#6B55A8,#2A1F42 75%);border:3px solid var(--violet);box-shadow:0 0 0 4px rgba(124,58,237,.18);display:grid;place-items:center;cursor:pointer}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar img.ph{object-fit:cover}
.avatar .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;border:3px solid var(--bg)}
.avatar .cam svg{width:15px;height:15px}
.myname{background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--text);font-family:inherit;font-size:20px;font-weight:800;line-height:1.2;text-align:center;width:220px;padding:2px 4px}
.myname:focus{outline:none;border-bottom-color:var(--lavender)}
.myname::placeholder{color:var(--muted)}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 8px 14px;border-bottom:1px solid var(--border);background:var(--bg);flex:none}
.brand{display:flex;align-items:center;gap:8px}
.brand img.logo{height:44px;width:auto;display:block}
.logo-big{width:min(290px,80%);height:auto;display:block;margin:0 auto}
.navic{width:28px;height:26px;object-fit:contain;display:block}
.wordmark.sm{font-size:22px}
.instr{display:flex;align-items:center;gap:6px;min-height:40px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 12px;font-size:13px}
.instr svg{width:18px;height:18px}
.instr.mini{min-height:36px;padding:0 10px;font-size:12px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="app" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</div>
<script>

/* ---------- Audio: metronomo, esempio, base ---------- */
let AC = null, NOISE = null;
function ac(){
  if(!AC){ AC = new (window.AudioContext || window.webkitAudioContext)(); const len = AC.sampleRate; NOISE = AC.createBuffer(1, len, AC.sampleRate); const d = NOISE.getChannelData(0); for(let i=0;i<len;i++) d[i] = Math.random()*2-1; }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
const hz = m => 440 * Math.pow(2, (m-69)/12);
function env(g, t, a, peak, dec){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t+a); g.gain.exponentialRampToValueAtTime(0.0001, t+a+dec); }
function click(t, accent, mid){ const o = AC.createOscillator(), g = AC.createGain(); o.type="square"; o.frequency.value = accent ? 1760 : mid ? 1450 : 1180; env(g,t,.002,accent?.22:mid?.17:.12,.03); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.06); }
function bassNote(m, t, dur, vol){ vol = vol || 1; const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain(); o.type="sawtooth"; o.frequency.value = hz(m); f.type="lowpass"; f.frequency.setValueAtTime(1100,t); f.frequency.exponentialRampToValueAtTime(260, t+dur); env(g,t,.006,.33*vol,Math.max(.08,dur*.95)); o.connect(f).connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.1); }
function noise(t, type, freq, peak, dec){ const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = NOISE; f.type = type; f.frequency.value = freq; env(g,t,.002,peak,dec); s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t+dec+.05); }
function kick(t){ const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(42,t+.14); env(g,t,.003,.65,.2); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.3); }
/*__SRC_AUDIO__*/

function streak(){
  let n = 0; const d = new Date();
  if(((S.practice[today()]||0) / 60) < S.goal) d.setDate(d.getDate()-1);
  for(;;){ const k = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(((S.practice[k]||0)/60) >= S.goal){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

function mastered(id){ const c = CONTENT[id]; if(!c) return false; return c.steps.every((s,i) => !(Array.isArray(s.bpm)) || (S.best[stepKey(id,i)]||0) >= s.bpm[1]); }
function tappa(id, current){
  const st = chState(id);
  if(st === "empty") return {img:"tappa_stato_bloccata", cls:"t-lock", label:""};
  if(st === "done") return mastered(id) ? {img:"tappa_completata_anello", cls:"t-ring", label:""} : {img:"tappa_completata_base", cls:"t-done", label:""};
  if(st === "progress" || current) return {img:"tappa_attuale_progress", cls:"t-cur", label:id};
  return {img:"tappa_attuale_base", cls:"t-cur", label:id};
}
function chState(id){
  const c = CONTENT[id]; if(!c) return "empty";
  const n = c.steps.filter((s,i) => S.done[stepKey(id,i)]).length;
  return n === c.steps.length ? "done" : n ? "progress" : "todo";
}

function render(){

/* Traccia del percorso: una linea curva che collega i capitoli, piena fin dove sei arrivato */
function drawTrail(){
  const box = document.querySelector(".path"); if(!box) return;
  const old = box.querySelector(".trail"); if(old) old.remove();
  const b = box.getBoundingClientRect();
  const nodes = [...box.querySelectorAll(".stop .node")]; if(nodes.length < 2) return;
  const pts = nodes.map(n => { const r = n.getBoundingClientRect(); return [r.left - b.left + r.width/2, r.top - b.top + r.height/2, n.classList.contains("done")]; });
  let d = `M${pts[0][0]} ${pts[0][1]}`, dDone = ""; let lastDone = -1; pts.forEach((p,i) => { if(p[2]) lastDone = i; });
  const seg = (a, c) => { const my = (a[1] + c[1]) / 2; return ` C${a[0]} ${my} ${c[0]} ${my} ${c[0]} ${c[1]}`; };
  for(let i = 1; i < pts.length; i++) d += seg(pts[i-1], pts[i]);
  if(lastDone > 0){ dDone = `M${pts[0][0]} ${pts[0][1]}`; for(let i = 1; i <= lastDone; i++) dDone += seg(pts[i-1], pts[i]); }
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "trail"); svg.setAttribute("width", b.width); svg.setAttribute("height", box.scrollHeight);
  svg.innerHTML = `<path d="${d}" fill="none" stroke="var(--border)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 16"/>` + (dDone ? `<path d="${dDone}" fill="none" stroke="var(--gold)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 16"/>` : "");
  box.prepend(svg);
}
window.addEventListener("resize", () => { if(V.screen === "path") drawTrail(); });
try { if(screen.orientation && screen.orientation.lock) screen.orientation.lock("portrait").catch(() => {}); } catch(e) {}
function go(screen, p){ P.stop(); UI = {}; V = {screen, p: p || {}}; render(); const sc = document.querySelector(".screen"); if(sc) sc.scrollTop = 0; }
function rerender(){ const sc = document.querySelector(".screen"); UI.scroll = sc ? sc.scrollTop : 0; render(); }
function curStep(){ return CONTENT[V.p.id].steps[V.p.i]; }

/* Basi iReal Pro: un file per base, con una battuta di count-in e il finale. Il tempo si cambia con playbackRate (intonazione invariata). */
const BASE = {a:null, info:null, failed:{}};
function baseInfo(){ const s = curStep(); if(!s || s.nobase) return null; return BASEMAP[stepKey(V.p.id, V.p.i)] || null; }
function baseAudio(info){
  if(!BASE.a){ BASE.a = new Audio(); BASE.a.preload = "auto"; BASE.a.addEventListener("ended", () => { if(P.on && P.cfg && P.cfg.real){ ACT["go-ex"](); } }); }
  const src = "basi/" + info.file.replace(/\.wav$/, ".mp3");
  if(BASE.a.getAttribute("src") !== src){ BASE.a.setAttribute("src", src); BASE.a.load(); }
  BASE.a.preservesPitch = true; BASE.a.mozPreservesPitch = true; BASE.a.webkitPreservesPitch = true;
  return BASE.a;
}
function exCfg(){
  const s = curStep();
  if(s.type === "crea") return {bpm:UI.bpm || s.bpm, chords:s.chords, meter:s.meter, swing:s.swing, base:UI.opt.base, click:UI.opt.click, example:false, events:[], onBeat:hiBeat, onChord:hiChord};
  const parsed = UI.parsed; const chords = parsed.bars.some(b => b.chords) ? parsed.bars.map(b => b.chord) : null;
  return {bpm:UI.bpm, beats:parsed.beats, bars:parsed.bars, chords, swing:s.swing, base:!!chords && UI.opt.base, click:UI.opt.click, example:UI.opt.example, events:parsed.events, onBeat:hiBeat, onNote:hiNote, onChord:hiChord};
}
function startExercise(){
  const cfg = exCfg(); const info = baseInfo();
  if(!(info && UI.opt.base && !BASE.failed[info.file])){ P.start(cfg); return; }
  ac(); const a = baseAudio(info); const rate = cfg.bpm / info.bpm;
  a.playbackRate = rate; a.currentTime = 0;
  cfg.base = false; cfg.click = false; cfg.real = true; cfg.info = info; cfg.onStop = () => { a.pause(); };
  P.cfg = cfg; P.on = true; P.startedAt = Date.now(); /* il pulsante mostra già "Ferma" mentre il file parte */
  a.play().then(() => {
    if(!P.on) { a.pause(); return; }
    P.on = false; P.cfg = null; cfg.at = AC.currentTime - a.currentTime / rate + (AC.outputLatency || 0);
    P.start(cfg);
  }).catch(() => { BASE.failed[info.file] = true; P.on = false; P.cfg = null; cfg.real = false; cfg.base = UI.opt.base; cfg.onStop = null; P.start(cfg); toast("Base non disponibile: suona quella sintetica."); });
}
const ACT = {
  go(v){ if(v==="path" || v==="practice" || v==="handbook" || v==="profile"){ if(!S.setup){ S.setup = true; save(); } } go(v); },
  start(){ S.setup = true; save(); go("path"); },
  strings(v){ S.strings = +v; save(); rerender(); },
  lefty(){ S.lefty = !S.lefty; save(); rerender(); },
  instr(){ UI.instr = true; rerender(); },
  instrclose(){ UI.instr = false; rerender(); },
  goal(v){ S.goal = +v; save(); rerender(); },
  rigor(){ S.rigor = !S.rigor; save(); rerender(); },
  path(v){ S.path = v; save(); render(); },
  chapter(v){ if(CONTENT[v]) go("chapter", {id:v}); else toast(`${v} · ${chTitle(v)}: in arrivo, dopo la prova sullo strumento.`); },
  step(v){ go("step", {id:V.p.id, i:+v}); },
  exit(){ go("chapter", {id:V.p.id}); },
  next(){ const s = curStep(); if(s.type === "lezione") markDone(); nextStep(); },
  view(v){ UI.view = v; rerender(); },
  reveal(){ UI.reveal = true; rerender(); },
  qplay(){ const s = curStep(), q = s.questions[UI.q.k]; ac(); const t0 = AC.currentTime + .05;
    q.play.forEach((m,j) => { const t = q.harm ? t0 : t0 + j*.55; if(m >= 52){ const o = AC.createOscillator(), g = AC.createGain(); o.type = "triangle"; o.frequency.value = hz(m); env(g, t, .01, .2, q.harm ? 1.6 : .6); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 2); } else bassNote(m, t, q.harm ? 1.6 : .55); }); },
  opt(v){ UI.opt[v] = !UI.opt[v]; if(P.on){ P.cfg.click = UI.opt.click && !P.cfg.real; P.cfg.example = UI.opt.example; if(P.cfg.real){ if(v==='base' && !UI.opt.base && BASE.a) BASE.a.muted = true; if(v==='base' && UI.opt.base && BASE.a) BASE.a.muted = false; } else P.cfg.base = UI.opt.base && !!P.cfg.chords; } rerender(); },
  bpm(v){ UI.bpm = Math.min(240, Math.max(30, (UI.bpm || (UI.free && UI.free.bpm) || 60) + (+v))); if(UI.free) UI.free.bpm = UI.bpm; P.setBpm(UI.bpm); if(P.on && P.cfg && P.cfg.real && BASE.a) BASE.a.playbackRate = UI.bpm / P.cfg.info.bpm; const b = document.getElementById("bpmv"); if(b) b.textContent = UI.bpm; },
  "go-ex"(){

  },

    const s = curStep(), k = stepKey(V.p.id, V.p.i), E = UI.eval;
    (S.evals[k] = S.evals[k] || []).push({r:E.r, bpm:E.bpm, t:Date.now()});
    if(E.r === "g") S.best[k] = Math.max(S.best[k] || 0, E.bpm);
    const ok = S.rigor ? (E.r === "g" && E.bpm >= s.bpm[1]) : true; if(ok) S.done[k] = true;
    save(); UI.eval = null; UI.noPropose = false; rerender();
    if(!ok) toast(`Salvato. In modalità rigorosa serve “pulito” a ${s.bpm[1]} BPM.`);
    else if(E.r === "r") toast("Salvato. Polly lo rimette nel ripasso di domani.");
  },
  plus5(){ UI.bpm = Math.min(240, UI.bpm + 5); UI.noPropose = true; rerender(); },
  nopropose(){ UI.noPropose = true; rerender(); },
  pick(v){ UI.q.sel = +v; rerender(); },
  qcheck(){ const s = curStep(), Q = UI.q; Q.checked = true; if(Q.sel === s.questions[Q.k].c) Q.score++; rerender(); },
  qnext(){ const s = curStep(), Q = UI.q; if(Q.k + 1 < s.questions.length){ Q.k++; Q.sel = null; Q.checked = false; } else Q.end = true; rerender(); },
  quizdone(){ markDone(); nextStep(); },
  quizretry(){ UI.q = null; rerender(); },
  chk(v, el){ UI.chk[+v] = el.checked; rerender(); },
  finish(){ P.stop(); markDone(); nextStep(); },
  rec(){ toast("La registrazione arriva nell'app: qui il browser non dà accesso al microfono."); },
  reset(){ const keep = {strings:S.strings, lefty:S.lefty, goal:S.goal, name:S.name, avatar:S.avatar}; S = Object.assign({}, DEF, keep, {setup:true}); save(); toast("Progressi azzerati."); go("profile"); }
};
document.getElementById("app").addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if(!el || el.disabled) return;
  if(el.dataset.a === "chk") return;
  const f = ACT[el.dataset.a]; if(f) f(el.dataset.v, el);
});
document.getElementById("app").addEventListener("change", e => {
  if(e.target.id === "nameIn"){ S.name = e.target.value.trim(); save(); return; }
  if(e.target.id === "avatarIn" && e.target.files[0]){ const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement("canvas"), n = 256, s = Math.min(im.width, im.height); c.width = c.height = n; c.getContext("2d").drawImage(im, (im.width-s)/2, (im.height-s)/2, s, s, 0, 0, n, n); S.avatar = c.toDataURL("image/jpeg", .85); save(); rerender(); toast("Foto aggiornata!"); }; im.src = r.result; }; r.readAsDataURL(e.target.files[0]); return; } const el = e.target.closest('[data-a="chk"]'); if(el) ACT.chk(el.dataset.v, el); });
render();
</script>
